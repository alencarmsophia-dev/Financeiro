  async deleteOrArchiveCategory(categoryId) {
    const cat = this.state.categories.find((c) => c.id === categoryId);
    if (!cat) return { ok: false, errors: ['Categoria não encontrada.'] };

    const inUse = isCategoryInUse(categoryId, {
      entries: this.state.entries,
      envelopes: this.state.envelopes,
      recurrences: this.state.recurrences
    });

    if (inUse) {
      const archived = { ...cat, arquivada: !cat.arquivada };
      await storage.put(STORES.CATEGORIES, archived);
      this.state.categories = this.state.categories.map((c) => (c.id === categoryId ? archived : c));
      this.showToast(
        archived.arquivada
          ? 'Categoria em uso: foi arquivada para preservar o histórico.'
          : 'Categoria reativada.',
        'info'
      );
      return { ok: true, archived: true };
    }

    await storage.delete(STORES.CATEGORIES, categoryId);
    this.state.categories = this.state.categories.filter((c) => c.id !== categoryId);
    this.showToast('Categoria sem uso removida.', 'success');
    return { ok: true, deleted: true };
  }

  async moveCategoryOrder(categoryId, direction) {
    const list = [...this.state.categories].sort((a, b) => a.ordem - b.ordem);
    const idx = list.findIndex((c) => c.id === categoryId);
    if (idx < 0) return;
    const swapIdx = direction === 'up' ? idx - 1 : idx + 1;
    if (swapIdx < 0 || swapIdx >= list.length) return;

    const tempOrder = list[idx].ordem;
    list[idx] = { ...list[idx], ordem: list[swapIdx].ordem };
    list[swapIdx] = { ...list[swapIdx], ordem: tempOrder };

    await storage.putMany(STORES.CATEGORIES, [list[idx], list[swapIdx]]);
    this.state.categories = list.sort((a, b) => a.ordem - b.ordem);
    this.notify();
  }

  async saveRecurrence(recInput) {
    return this.withLock('saveRecurrence', async () => {
      const descricao = String(recInput.descricao || '').trim();
      if (!descricao) return { ok: false, errors: ['Informe a descrição da recorrência.'] };
      if (!recInput.valor || recInput.valor <= 0) return { ok: false, errors: ['Informe um valor válido.'] };

      const rec = {
        id: recInput.id || generateId(),
        descricao,
        tipo: recInput.tipo === 'entrada' ? 'entrada' : 'saida',
        valor: recInput.valor,
        diaVencimento: Math.max(1, Math.min(31, Number(recInput.diaVencimento) || 1)),
        mesVencimento: Math.max(1, Math.min(12, Number(recInput.mesVencimento) || 1)),
        frequencia: ['mensal', 'semanal', 'anual'].includes(recInput.frequencia) ? recInput.frequencia : 'mensal',
        contaId: recInput.contaId || this.state.accounts[0]?.id || 'acc_corrente',
        categoriaId: recInput.categoriaId || this.state.categories[0]?.id || 'cat_moradia',
        ativa: recInput.ativa !== false
      };

      await storage.put(STORES.RECURRENCES, rec);
      const exists = this.state.recurrences.some((r) => r.id === rec.id);
      this.state.recurrences = exists
        ? this.state.recurrences.map((r) => (r.id === rec.id ? rec : r))
        : [...this.state.recurrences, rec];

      this.showToast('Recorrência salva.', 'success');
      return { ok: true, recurrence: rec };
    });
  }

  /**

  async saveGoal(goalInput) {

      const nome = String(goalInput.nome || '').trim();
      if (!nome) return { ok: false, errors: ['Informe o nome da meta.'] };
      if (!goalInput.valorAlvo || goalInput.valorAlvo <= 0) {
        return { ok: false, errors: ['Informe um valor-alvo positivo.'] };
      }

      const goal = {
        id: goalInput.id || generateId(),
        nome,
        valorAlvo: goalInput.valorAlvo,
        valorAtual: Math.max(0, Number(goalInput.valorAtual) || 0),
        aporteMensal: Math.max(0, Number(goalInput.aporteMensal) || 0),
        cor: goalInput.cor || '#4B6B53'
      };

      await storage.put(STORES.GOALS, goal);
      const exists = this.state.goals.some((g) => g.id === goal.id);
      this.state.goals = exists
        ? this.state.goals.map((g) => (g.id === goal.id ? goal : g))
        : [...this.state.goals, goal];

      this.showToast('Meta de economia atualizada.', 'success');
      return { ok: true, goal };
    });
  }

  async updateSettings(partial) {
    const updated = {
      ...this.state.settings,
      ...partial,
      id: 'app_settings'
    };
    await storage.put(STORES.SETTINGS, updated);
    this.state.settings = updated;

    await this.updateSettings({ hideValues: !this.state.settings.hideValues });

  async configurePin(newPin) {
    if (!newPin) {
      await this.updateSettings({ pinHash: null, pinSalt: null });
      this.state.locked = false;
      this.showToast('PIN de bloqueio desativado.', 'info');
      return { ok: true };
    }
    try {
      const { hash, salt } = await hashPin(newPin);
      await this.updateSettings({ pinHash: hash, pinSalt: salt });
      this.showToast('PIN de segurança configurado.', 'success');
      return { ok: true };
    } catch (err) {
      return { ok: false, errors: [err.message] };
    }
  }

  async unlockWithPin(pinAttempt) {
    if (!this.state.settings.pinHash) {
      this.state.locked = false;
      this.notify();
      return { ok: true };
    }
    try {
      const { hash } = await hashPin(pinAttempt, this.state.settings.pinSalt);
      if (hash === this.state.settings.pinHash) {
        this.state.locked = false;
        this.notify();
        return { ok: true };
      }
      return { ok: false, error: 'PIN incorreto. Tente novamente.' };
    } catch (_) {
      return { ok: false, error: 'Digite um PIN numérico de 4 a 6 dígitos.' };
    }
  }

      this.state.accounts = reloaded.accounts.sort((a, b) => a.ordem - b.ordem);

      this.state.entries = this._sortEntries(reloaded.entries);
      this.state.envelopes = reloaded.envelopes;
      this.state.recurrences = reloaded.recurrences;
      this.state.goals = reloaded.goals;
      this.state.settings = reloaded.settings;
      this.showToast(
        mode === 'replace'
          ? 'Backup restaurado por substituição completa.'
          : 'Backup mesclado aos dados atuais.',
        'success'
      );
      return { ok: true, data: applied };
    });
  }

  /**

  async clearAllData() {

/**
 * RAZÃO — Módulo de Backup, Restauração e Exportação (backup.js)
 * Regras:
 * - Exportar e importar JSON (ida e volta idêntica, sem perda de dados).
 * - Validação de schema, resumo para pré-visualização e escolha entre mesclar ou substituir.
 * - Exportação CSV do histórico compatível com Excel/Planilhas (UTF-8 BOM, separador ';').
 * - Lembrete discreto de backup a cada 30 dias.
 */




/**
 * Gera o objeto e a string JSON de backup completo a partir do estado atual.
 * @param {object} state
 * @returns {{ payload: object, jsonString: string }}
 */
function buildBackupJSON(state) {
  const payload = {
    app: 'RAZAO',
    schemaVersion: CURRENT_SCHEMA_VERSION,
    exportedAt: new Date().toISOString(),
    accounts: structuredClone(state.accounts || []),
    categories: structuredClone(state.categories || []),
    entries: structuredClone(state.entries || []),
    envelopes: structuredClone(state.envelopes || []),
    recurrences: structuredClone(state.recurrences || []),
    goals: structuredClone(state.goals || []),
    settings: structuredClone(state.settings || {})
  };

  return {
    payload,
    jsonString: JSON.stringify(payload, null, 2)
  };
}

/**
 * Valida um JSON de backup enviado pelo usuário e gera dados de pré-visualização.
 * @param {string|object} rawJson
 * @returns {{
 *   ok: boolean,
 *   errors: string[],
 *   snapshot?: object,
 *   preview?: {
 *     schemaVersion: number,
 *     exportedAt: string | null,
 *     accountsCount: number,
 *     categoriesCount: number,
 *     entriesCount: number,
 *     envelopesCount: number,
 *     recurrencesCount: number,
 *     goalsCount: number
 *   }
 * }}
 */
function validateAndPreviewBackupJSON(rawJson) {
  const errors = [];
  let parsed = null;

  try {
    parsed = typeof rawJson === 'string' ? JSON.parse(rawJson) : rawJson;
  } catch (_) {
    return { ok: false, errors: ['O arquivo selecionado não é um JSON válido.'] };
  }

  if (!parsed || typeof parsed !== 'object' || Array.isArray(parsed)) {
    return { ok: false, errors: ['Estrutura de arquivo inválida: objeto raiz ausente.'] };
  }

  if (parsed.app && parsed.app !== 'RAZAO') {
    errors.push('Este arquivo não parece pertencer ao sistema RAZÃO.');
  }

  const hasAnyCollection =
    Array.isArray(parsed.entries) ||
    Array.isArray(parsed.accounts) ||
    Array.isArray(parsed.categories);

  if (!hasAnyCollection) {
    errors.push('O arquivo não contém coleções válidas (lançamentos, contas ou categorias).');
  }

  if (Array.isArray(parsed.entries)) {
    for (let i = 0; i < parsed.entries.length; i++) {
      const e = parsed.entries[i];
      if (!e || typeof e !== 'object') {
        errors.push(`Lançamento na posição ${i + 1} está corrompido.`);
        break;
      }
      if (!['entrada', 'saida', 'transferencia'].includes(e.tipo)) {
        errors.push(`Lançamento "${e.descricao || i + 1}" possui tipo inválido (${e.tipo}).`);
        break;
      }
      if (!isValidCents(e.valor) || e.valor <= 0) {
        errors.push(`Lançamento "${e.descricao || i + 1}" possui valor inválido (deve ser inteiro em centavos).`);
        break;
      }
      if (!isValidISODate(e.data)) {
        errors.push(`Lançamento "${e.descricao || i + 1}" possui data inválida (${e.data}).`);
        break;
      }
    }
  }

  if (errors.length > 0) {
    return { ok: false, errors };
  }

  const migrated = migrateSnapshotData(parsed);

  return {
    ok: true,
    errors: [],
    snapshot: migrated,
    preview: {
      schemaVersion: Number(parsed.schemaVersion || 1),
      exportedAt: parsed.exportedAt || null,
      accountsCount: migrated.accounts.length,
      categoriesCount: migrated.categories.length,
      entriesCount: migrated.entries.length,
      envelopesCount: migrated.envelopes.length,
      recurrencesCount: migrated.recurrences.length,
      goalsCount: migrated.goals.length
    }
  };
}

/**
 * Gera conteúdo CSV de todos os lançamentos (ou lançamentos filtrados).
 * Escapa aspas duplas e adiciona BOM UTF-8 para abrir corretamente no Excel.
 *
 * @param {Array} entries
 * @param {Array} accounts
 * @param {Array} categories
 * @returns {string}
 */
function buildEntriesCSV(entries, accounts = [], categories = []) {
  const accMap = new Map(accounts.map((a) => [a.id, a.nome]));
  const catMap = new Map(categories.map((c) => [c.id, c.nome]));

  const escapeCSV = (val) => {
    const str = String(val ?? '').replace(/\r?\n/g, ' ');
    if (/[";,]/.test(str)) {
      return `"${str.replace(/"/g, '""')}"`;
    }
    return str;
  };

  const headers = [
    'ID',
    'Data',
    'Tipo',
    'Descricao',
    'Valor_BRL',
    'Valor_Centavos',
    'Conta_Origem',
    'Conta_Destino',
    'Categoria',
    'Etiquetas',
    'Observacao',
    'Criado_Em',
    'Editado_Em'
  ];

  const rows = [headers.join(';')];

  for (let i = 0; i < entries.length; i++) {
    const e = entries[i];
    const tipoLabel =
      e.tipo === 'entrada' ? 'Entrada' : e.tipo === 'saida' ? 'Saída' : 'Transferência';
    const valorSigned = e.tipo === 'saida' ? -e.valor : e.valor;

    const row = [
      escapeCSV(e.id),
      escapeCSV(e.data),
      escapeCSV(tipoLabel),
      escapeCSV(e.descricao),
      escapeCSV(formatDecimalBRL(valorSigned)),
      escapeCSV(valorSigned),
      escapeCSV(accMap.get(e.contaId) || e.contaId),
      escapeCSV(e.contaDestinoId ? (accMap.get(e.contaDestinoId) || e.contaDestinoId) : ''),
      escapeCSV(e.categoriaId ? (catMap.get(e.categoriaId) || e.categoriaId) : 'Transferência'),
      escapeCSV(Array.isArray(e.etiquetas) ? e.etiquetas.join(', ') : ''),
      escapeCSV(e.observacao || ''),
      escapeCSV(e.criadoEm || ''),
      escapeCSV(e.editadoEm || '')
    ];
    rows.push(row.join(';'));
  }

  return '\uFEFF' + rows.join('\r\n');
}

/**
 * Verifica se o lembrete discreto de backup (a cada 30 dias) deve ser exibido.
 * @param {object} settings
 * @param {number} entriesCount
 * @param {string} [refToday]
 * @returns {{ shouldRemind: boolean, daysSinceLastBackup: number | null }}
 */
function checkBackupReminder(settings, entriesCount, refToday = todayISO()) {
  if (!entriesCount || entriesCount === 0) {
    return { shouldRemind: false, daysSinceLastBackup: null };
  }
  const dismissedUntil = settings?.backupDismissedUntil ? String(settings.backupDismissedUntil).slice(0, 10) : null;
  if (dismissedUntil && isValidISODate(dismissedUntil) && refToday <= dismissedUntil) {
    return { shouldRemind: false, daysSinceLastBackup: null };
  }
  const lastBackup = settings?.lastBackupAt;
  if (!lastBackup) {
    return { shouldRemind: true, daysSinceLastBackup: null };
  }
  const lastDateISO = String(lastBackup).slice(0, 10);
  if (!isValidISODate(lastDateISO)) {
    return { shouldRemind: true, daysSinceLastBackup: null };
  }
  const days = diffDaysISO(lastDateISO, refToday);
  return {
    shouldRemind: days >= 30,
    daysSinceLastBackup: days
  };
}

/**
 * Dispara o download de um arquivo de texto no navegador.
 */
function triggerFileDownload(filename, content, mimeType = 'application/json;charset=utf-8') {
  const blob = new Blob([content], { type: mimeType });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => {
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }, 200);
}

function escapeAttr(str) {
  return String(str ?? '')
    .replace(/&/g, '&amp;')
    .replace(/"/g, '&quot;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
}

/**
 * 1. Gráfico de Rosca por Categoria com stroke-dasharray animado e destaque ao tocar na legenda
 * @param {Array<{ categoriaId: string, nome: string, cor: string, valor: number, percentual: number }>} categoriesData
 * @param {number} totalExpenseCents
 * @param {boolean} hideValues
 * @returns {string}
 */
function renderCategoryDonutSVG(categoriesData, totalExpenseCents, hideValues = false) {
  if (!categoriesData || categoriesData.length === 0 || totalExpenseCents <= 0) {
    return `
      <div class="chart-empty" role="status">
        <p>Nenhuma saída registrada neste mês para compor o gráfico por categoria.</p>
      </div>
    `;
  }

  const cx = 110;
  const cy = 110;
  const radius = 78;
  const circumference = 2 * Math.PI * radius; // ~490.09
  let accumulatedLength = 0;

  const slices = categoriesData.map((item, idx) => {
    const fraction = item.valor / totalExpenseCents;
    const segLength = Math.max(4, fraction * circumference);
    const dashArray = `${segLength.toFixed(2)} ${(circumference - segLength).toFixed(2)}`;
    const dashOffset = (circumference * 0.25 - accumulatedLength).toFixed(2);
    accumulatedLength += segLength;

    const valFormatted = hideValues ? 'R$ ••••' : formatBRL(item.valor);
    const tooltipText = `${item.nome}: ${valFormatted} (${item.percentual}%)`;

    return `
      <circle
        cx="${cx}"
        cy="${cy}"
        r="${radius}"
        fill="none"
        stroke="${escapeAttr(item.cor)}"
        stroke-width="26"
        stroke-dasharray="${dashArray}"
        stroke-dashoffset="${dashOffset}"
        class="svg-interactive-shape donut-slice-arc"
        tabindex="0"
        role="graphics-symbol"
        aria-label="${escapeAttr(tooltipText)}"
        data-tooltip-title="${escapeAttr(item.nome)}"
        data-tooltip-value="${escapeAttr(valFormatted)}"
        data-tooltip-sub="${item.percentual}% das saídas do mês"
        data-slice-idx="${idx}"
      >
        <title>${escapeAttr(tooltipText)}</title>
      </circle>
    `;
  });

  const centerValue = hideValues ? 'R$ ••••' : formatBRL(totalExpenseCents);

  return `
    <div class="donut-layout">
      <div class="donut-svg-wrap">
        <svg viewBox="0 0 220 220" class="ledger-svg donut-svg" role="img" aria-label="Gráfico de rosca de despesas por categoria. Total: ${escapeAttr(centerValue)}">
          <circle cx="${cx}" cy="${cy}" r="${radius}" fill="none" stroke="var(--border-subtle)" stroke-width="26"></circle>
          ${slices.join('')}
          <text x="${cx}" y="${cy - 8}" text-anchor="middle" class="svg-center-caption">SAÍDAS DO MÊS</text>
          <text x="${cx}" y="${cy + 14}" text-anchor="middle" class="svg-center-total value-maskable">${escapeAttr(centerValue)}</text>
        </svg>
      </div>
      <ul class="donut-legend" aria-label="Legenda de categorias">
        ${categoriesData
          .slice(0, 7)
          .map((item, idx) => {
            const valFormatted = hideValues ? 'R$ ••••' : formatBRL(item.valor);
            return `
              <li class="donut-legend-item" tabindex="0"
                  role="button"
                  data-action="highlight-donut-slice"
                  data-slice-idx="${idx}"
                  data-tooltip-title="${escapeAttr(item.nome)}"
                  data-tooltip-value="${escapeAttr(valFormatted)}"
                  data-tooltip-sub="${item.percentual}% do total de saídas">
                <span class="legend-dot" style="background-color: ${escapeAttr(item.cor)}"></span>
                <span class="legend-name">${escapeAttr(item.nome)}</span>
                <span class="legend-pct">${item.percentual}%</span>
                <span class="legend-val value-maskable">${escapeAttr(valFormatted)}</span>
              </li>
            `;
          })
          .join('')}
      </ul>
    </div>
  `;
}

/**
 * 2. Gráfico de Barras Diárias (Entradas vs Saídas por dia do mês)
 */
function renderDailyBarsSVG(dailySeries, hideValues = false) {
  if (!dailySeries || dailySeries.length === 0) {
    return `<div class="chart-empty"><p>Sem dados diários para exibir.</p></div>`;
  }

  const maxVal = Math.max(100, ...dailySeries.map((d) => Math.max(d.income, d.expense)));
  const hasMovement = dailySeries.some((d) => d.income > 0 || d.expense > 0);
  if (!hasMovement) {
    return `
      <div class="chart-empty" role="status">
        <p>Nenhum movimento diário registrado neste mês.</p>
      </div>
    `;
  }

  const width = 620;
  const height = 210;
  const padLeft = 16;
  const padRight = 12;
  const padTop = 18;
  const padBottom = 30;
  const plotW = width - padLeft - padRight;
  const plotH = height - padTop - padBottom;
  const stepX = plotW / dailySeries.length;
  const barW = Math.max(4, Math.min(11, stepX * 0.56));

  const gridLines = [0, 0.5, 1].map((ratio) => {
    const y = padTop + plotH * (1 - ratio);
    return `<line x1="${padLeft}" y1="${y.toFixed(1)}" x2="${width - padRight}" y2="${y.toFixed(1)}" class="svg-grid-line" />`;
  });

  const bars = dailySeries.map((d, i) => {
    const xCenter = padLeft + i * stepX + stepX / 2;
    const expH = d.expense > 0 ? Math.max(4, (d.expense / maxVal) * plotH) : 0;
    const incH = d.income > 0 ? Math.max(4, (d.income / maxVal) * plotH) : 0;

    const yExp = padTop + plotH - expH;
    const yInc = padTop + plotH - incH;

    const incStr = hideValues ? 'R$ ••••' : formatBRL(d.income);
    const expStr = hideValues ? 'R$ ••••' : formatBRL(d.expense);
    const dayLabel = `Dia ${String(d.day).padStart(2, '0')}`;
    const showXLabel = d.day === 1 || d.day % 5 === 0 || d.day === dailySeries.length;

    return `
      <g class="svg-bar-group svg-interactive-shape"
         tabindex="0"
         role="graphics-symbol"
         aria-label="${escapeAttr(`${dayLabel}: Entradas ${incStr}, Saídas ${expStr}`)}"
         data-tooltip-title="${escapeAttr(dayLabel)}"
         data-tooltip-value="Saídas: ${escapeAttr(expStr)}"
         data-tooltip-sub="Entradas: ${escapeAttr(incStr)}">
        <rect x="${(xCenter - barW).toFixed(1)}" y="${padTop}" width="${(barW * 2).toFixed(1)}" height="${plotH}" fill="transparent" />
        ${
          incH > 0
            ? `<rect x="${(xCenter - barW / 2).toFixed(1)}" y="${yInc.toFixed(1)}" width="${barW.toFixed(1)}" height="${incH.toFixed(1)}" rx="2.5" class="svg-bar-income" />`
            : ''
        }
        ${
          expH > 0
            ? `<rect x="${(xCenter - barW / 2).toFixed(1)}" y="${yExp.toFixed(1)}" width="${barW.toFixed(1)}" height="${expH.toFixed(1)}" rx="2.5" class="svg-bar-expense" />`
            : ''
        }
        ${
          showXLabel
            ? `<text x="${xCenter.toFixed(1)}" y="${height - 8}" text-anchor="middle" class="svg-axis-label">${String(d.day).padStart(2, '0')}</text>`
            : ''
        }
      </g>
    `;
  });

  return `
    <div class="svg-scroll-container">
      <svg viewBox="0 0 ${width} ${height}" class="ledger-svg bars-svg" role="img" aria-label="Gráfico de barras de movimentação diária do mês">
        ${gridLines.join('')}
        ${bars.join('')}
      </svg>
    </div>
  `;
}

/**
 * 3. Gráfico de Linha de Saldo Acumulado com Gradiente Vertical SVG
 */
function renderCumulativeBalanceLineSVG(dailySeries, hideValues = false) {
  if (!dailySeries || dailySeries.length === 0) {
    return `<div class="chart-empty"><p>Sem dados de saldo acumulado neste mês.</p></div>`;
  }

  const balances = dailySeries.map((d) => d.balance);
  const minBal = Math.min(0, ...balances);
  const maxBal = Math.max(100, ...balances);
  const range = Math.max(100, maxBal - minBal);

  const width = 620;
  const height = 210;
  const padLeft = 18;
  const padRight = 18;
  const padTop = 20;
  const padBottom = 30;
  const plotW = width - padLeft - padRight;
  const plotH = height - padTop - padBottom;

  const getCoords = (idx, bal) => {
    const x = padLeft + (idx / Math.max(1, dailySeries.length - 1)) * plotW;
    const y = padTop + plotH - ((bal - minBal) / range) * plotH;
    return { x, y };
  };

  const points = dailySeries.map((d, idx) => getCoords(idx, d.balance));
  const polylinePoints = points.map((p) => `${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');
  const zeroY = padTop + plotH - ((0 - minBal) / range) * plotH;

  const areaPath = [
    `M ${points[0].x.toFixed(1)} ${zeroY.toFixed(1)}`,
    ...points.map((p) => `L ${p.x.toFixed(1)} ${p.y.toFixed(1)}`),
    `L ${points[points.length - 1].x.toFixed(1)} ${zeroY.toFixed(1)}`,
    'Z'
  ].join(' ');

  const dots = dailySeries.map((d, idx) => {
    const pt = points[idx];
    const balStr = hideValues ? 'R$ ••••' : formatBRL(d.balance);
    const dayLabel = `Dia ${String(d.day).padStart(2, '0')}`;
    const showDot = d.day === 1 || d.day % 5 === 0 || idx === dailySeries.length - 1;

    return `
      <g class="svg-point-group svg-interactive-shape"
         tabindex="0"
         role="graphics-symbol"
         aria-label="${escapeAttr(`${dayLabel}: Saldo acumulado ${balStr}`)}"
         data-tooltip-title="${escapeAttr(`${dayLabel} (${d.date.slice(8, 10)}/${d.date.slice(5, 7)})`)}"
         data-tooltip-value="Saldo: ${escapeAttr(balStr)}"
         data-tooltip-sub="${d.balance >= 0 ? 'Saldo positivo' : 'Saldo no negativo'}">
        <circle cx="${pt.x.toFixed(1)}" cy="${pt.y.toFixed(1)}" r="12" fill="transparent" />
        <circle cx="${pt.x.toFixed(1)}" cy="${pt.y.toFixed(1)}" r="${showDot ? '4' : '2.2'}" class="svg-line-dot" />
        ${
          showDot
            ? `<text x="${pt.x.toFixed(1)}" y="${height - 8}" text-anchor="middle" class="svg-axis-label">${String(d.day).padStart(2, '0')}</text>`
            : ''
        }
      </g>
    `;
  });

  return `
    <div class="svg-scroll-container">
      <svg viewBox="0 0 ${width} ${height}" class="ledger-svg line-svg" role="img" aria-label="Gráfico de linha de evolução do saldo acumulado no mês">
        <defs>
          <linearGradient id="balanceAreaGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="var(--color-income)" stop-opacity="0.32" />
            <stop offset="100%" stop-color="var(--color-income)" stop-opacity="0.02" />
          </linearGradient>
        </defs>
        <line x1="${padLeft}" y1="${zeroY.toFixed(1)}" x2="${width - padRight}" y2="${zeroY.toFixed(1)}" class="svg-zero-line" />
        <path d="${areaPath}" fill="url(#balanceAreaGrad)" class="svg-balance-area" />
        <polyline fill="none" points="${polylinePoints}" class="svg-balance-line" />
        ${dots.join('')}
      </svg>
    </div>
  `;
}

 * Regras:
 * - B4: Conjunto completo de ícones SVG inline (traço 1.75, estilo Lucide), zero símbolos de texto crus.
 * - Escapar TODO texto de usuário antes de inserir em templates (zero XSS).
 * - Contagem animada discreta do saldo respeitando prefers-reduced-motion.
 */

const HTML_ESCAPE_MAP = {
  '&': '&amp;',
  '<': '&lt;',
  '>': '&gt;',
  '"': '&quot;',
  "'": '&#39;'
};

/**
 * Escapa texto livre do usuário para uso seguro em HTML.
 * @param {unknown} str
 * @returns {string}
 */
function escapeHTML(str) {
  if (str === null || str === undefined) return '';
  return String(str).replace(/[&<>"']/g, (ch) => HTML_ESCAPE_MAP[ch]);
}

/**
 * Formata um valor em centavos respeitando o modo "ocultar valores" (privacidade).
 * @param {number} cents
 * @param {boolean} hideValues
 * @param {{ showSign?: boolean }} [options]
 * @returns {string}
 */
function displayMoney(cents, hideValues = false, options = {}) {
  const formatted = formatBRL(cents, options);
  if (hideValues) {
    return `<span class="money-value is-blurred" aria-label="Valor oculto">${escapeHTML(formatted)}</span>`;
  }
  return `<span class="money-value">${escapeHTML(formatted)}</span>`;
}

/**
 * Anima a contagem de um número em centavos em um elemento DOM,
 * respeitando a preferência de movimento reduzido do sistema operacional.
 *
 * @param {HTMLElement} el
 * @param {number} fromCents
 * @param {number} toCents
 * @param {boolean} hideValues
 */
function animateCurrencyCounter(el, fromCents, toCents, hideValues = false) {
  if (!el) return;
  const prefersReduced =
    typeof window !== 'undefined' &&
    window.matchMedia &&
    window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  if (prefersReduced || fromCents === toCents || hideValues) {
    el.textContent = formatBRL(toCents);
    el.classList.toggle('is-blurred', Boolean(hideValues));
    return;
  }

  const duration = 280;
  const startTime = performance.now();
  const diff = toCents - fromCents;

  function step(now) {
    const elapsed = Math.min(1, (now - startTime) / duration);
    const eased = 1 - Math.pow(1 - elapsed, 3);
    const current = Math.round(fromCents + diff * eased);
    el.textContent = formatBRL(current);
    if (elapsed < 1) {
      requestAnimationFrame(step);
    } else {
      el.textContent = formatBRL(toCents);
    }
  }

  requestAnimationFrame(step);
}

/**
 * Renderiza uma linha contábil individual do Livro-Razão.
 * - Margem esquerda com data contábil.
 * - Ícone da categoria em círculo colorido.
 * - Sem botão "×" fixo: tocar na linha abre a folha de edição (onde ficam Salvar e Excluir).
 * - Entrada escalonada nas primeiras 12 linhas (staggerIndex).
 *
 * @param {object} entry
 * @param {{ accountsMap: Map, categoriesMap: Map, hideValues: boolean, showMarginDate?: boolean, staggerIndex?: number }} ctx
 * @returns {string}
 */
function renderLedgerRow(entry, ctx) {
  const { accountsMap, categoriesMap, hideValues, showMarginDate = true, staggerIndex = 0 } = ctx;
  const margin = formatLedgerMarginDate(entry.data);
  const originAcc = accountsMap.get(entry.contaId);
  const destAcc = entry.contaDestinoId ? accountsMap.get(entry.contaDestinoId) : null;
  const cat = entry.categoriaId ? categoriesMap.get(entry.categoriaId) : null;

  let typeClass = 'is-expense';
  let signPrefix = '- ';
  let subtitle = '';
  let iconName = cat?.icone || 'tag';
  let badgeColor = cat?.cor || '#8F684D';

  if (entry.tipo === 'entrada') {
    typeClass = 'is-income';
    signPrefix = '+ ';
    subtitle = `${cat ? cat.nome : 'Entrada'} · ${originAcc ? originAcc.nome : 'Conta'}`;
    badgeColor = cat?.cor || '#4B6B53';
  } else if (entry.tipo === 'transferencia') {
    typeClass = 'is-transfer';
    signPrefix = '⇄ ';
    iconName = 'transfer';
    subtitle = `${originAcc ? originAcc.nome : 'Origem'} → ${destAcc ? destAcc.nome : 'Destino'}`;
    badgeColor = '#5A7684';
  } else {
    typeClass = 'is-expense';
    signPrefix = '- ';
    subtitle = `${cat ? cat.nome : 'Saída'} · ${originAcc ? originAcc.nome : 'Conta'}`;
  }

  const tagsMarkup =
    Array.isArray(entry.etiquetas) && entry.etiquetas.length > 0
      ? `<span class="ledger-tags">${entry.etiquetas
          .slice(0, 3)
          .map((t) => `<span class="ledger-tag">#${escapeHTML(t)}</span>`)
          .join('')}</span>`
      : '';

  const editedBadge = entry.editadoEm
    ? `<span class="ledger-edited-badge" title="Editado — toque para ver histórico">editado</span>`
    : '';

  const delayMs = staggerIndex < 12 ? staggerIndex * 22 : 0;

  return `
    <article class="ledger-row ${typeClass}" data-entry-id="${escapeHTML(entry.id)}" style="--stagger-delay: ${delayMs}ms">
      <div class="ledger-margin" aria-hidden="${!showMarginDate}">
        ${
          showMarginDate
            ? `<span class="margin-day">${escapeHTML(margin.dayNum)}</span>
               <span class="margin-month">${escapeHTML(margin.monthShort)}</span>`
            : `<span class="margin-ditto">〃</span>`
        }
      </div>
      <button type="button" class="ledger-row-main" data-action="edit-entry" data-entry-id="${escapeHTML(entry.id)}" aria-label="Abrir lançamento ${escapeHTML(entry.descricao)}">
        <span class="ledger-cat-circle" style="--circle-color: ${escapeHTML(badgeColor)}">
          ${getIconSVG(iconName)}
        </span>
        <div class="ledger-row-body">
          <div class="ledger-row-title-line">
            <span class="ledger-desc">${escapeHTML(entry.descricao)}</span>
            ${editedBadge}
          </div>
          <div class="ledger-row-meta">
            <span class="ledger-sub">${escapeHTML(subtitle)}</span>
            ${tagsMarkup}
          </div>
        </div>
        <div class="ledger-row-amount ${typeClass}">
          <span class="amount-prefix">${signPrefix}</span>${displayMoney(entry.valor, hideValues)}
        </div>
      </button>
    </article>
  `;
}

 * - "Próximos vencimentos" com chips de dias restantes ("Hoje", "Em Xd", "Atrasado").

/**
 * Renderiza o anel SVG "Ritmo do Mês" (dias passados vs ritmo de consumo).
 */
function renderMonthPaceRingSVG(selectedMonth, summary, envelopes) {
  const today = todayISO();
  const bounds = getMonthBounds(selectedMonth);
  const parsedToday = parseISODate(today);

  let daysElapsedPct = 100;
  if (selectedMonth > today.slice(0, 7)) {
    daysElapsedPct = 0;
  } else if (selectedMonth === today.slice(0, 7) && parsedToday) {
    daysElapsedPct = Math.round((parsedToday.day / bounds.totalDays) * 100);
  }

  const totalEnvelopeBudget = envelopes.reduce((acc, e) => acc + (e.limiteMensal || 0), 0);
  const referenceBudget = totalEnvelopeBudget > 0 ? totalEnvelopeBudget : Math.max(summary.entradas, summary.saidas, 1);
  const spentPct = summary.saidas > 0 ? Math.min(100, Math.round((summary.saidas / referenceBudget) * 100)) : 0;

  const r = 24;
  const circ = 2 * Math.PI * r; // ~150.8
  const dash = ((spentPct / 100) * circ).toFixed(1);
  const paceColor = spentPct > daysElapsedPct + 15 ? 'var(--color-warning)' : 'var(--color-income)';

  return `
    <div class="hero-pace-widget" title="Ritmo do mês: ${daysElapsedPct}% do mês decorrido · ${spentPct}% do orçamento consumido">
      <svg viewBox="0 0 60 60" width="56" height="56" class="pace-ring-svg" aria-label="Anel de ritmo do mês: ${spentPct}% gasto">
        <circle cx="30" cy="30" r="${r}" fill="none" stroke="var(--border-subtle)" stroke-width="5" />
        <circle
          cx="30"
          cy="30"
          r="${r}"
          fill="none"
          stroke="${paceColor}"
          stroke-width="5"
          stroke-linecap="round"
          stroke-dasharray="${dash} ${circ.toFixed(1)}"
          transform="rotate(-90 30 30)"
          class="pace-ring-progress"
        />
        <text x="30" y="34" text-anchor="middle" class="pace-ring-text">${spentPct}%</text>
      </svg>
      <div class="pace-meta">
        <span class="pace-title">Ritmo do mês</span>
        <span class="pace-sub">${daysElapsedPct}% dos dias · ${spentPct}% gasto</span>
      </div>
    </div>
  `;
}

/**
 * Item 1: Renderiza sempre 7 colunas (hoje e os 6 dias anteriores, cruzando o mês se preciso),
 * com altura proporcional ao maior gasto da semana, letra do dia da semana (S T Q Q S S D),
 * animação de subida e valor exibido ao tocar na barra. Dia sem gasto = barra mínima apagada.
 */
function renderMini7DaysBars(entries, refTodayISO, hideValues) {
  const series = buildLast7DaysSeries(entries, refTodayISO);
  const todayItem = series[series.length - 1];
  const defaultValStr = hideValues ? 'R$ ••••' : formatBRL(todayItem ? todayItem.expense : 0);

  return `

      <div class="mini-7d-header">
        <span class="mini-7d-label">Últimos 7 dias</span>
        <span class="mini-7d-touch-val" id="mini-7d-value-readout">Hoje: ${escapeHTML(defaultValStr)}</span>
      </div>
      <div class="mini-7d-bars" role="group" aria-label="Barras dos últimos 7 dias">
        ${series
          .map((d, idx) => {
            const barClass = d.hasExpense ? 'is-exp' : 'is-idle';
            const valFormatted = hideValues ? 'R$ ••••' : formatBRL(d.expense);
            const dateShort = `${d.date.slice(8, 10)}/${d.date.slice(5, 7)}`;
            const delayMs = idx * 25;
            return `
              <button
                type="button"
                class="mini-bar-col ${idx === series.length - 1 ? 'is-selected' : ''}"

                data-7d-date="${escapeHTML(dateShort)}"
                data-7d-weekday="${escapeHTML(d.weekdayLetter)}"
                data-7d-val="${escapeHTML(valFormatted)}"
                aria-label="${escapeHTML(`${d.weekdayLetter} (${dateShort}): ${valFormatted}`)}"
                title="${escapeHTML(`${dateShort}: ${valFormatted}`)}">
                <div class="mini-bar-track">
                  <div class="mini-bar-fill ${barClass}" style="height: ${d.heightPct}%; animation-delay: ${delayMs}ms"></div>
                </div>
                <span class="mini-bar-day">${escapeHTML(d.weekdayLetter)}</span>
              </button>
            `;
          })
          .join('')}
      </div>
    </div>
  `;
}

                     if (delta < 0) {
                       chipText = `Há ${Math.abs(delta)}d`;

                       chipClass = 'is-today';

                     return `

                           <span>Confirmar</span>
                         </button>
                       </div>
                     `;
                   })
                   .join('')}
               </div>`
        }
      </section>

      <!-- ÚLTIMOS LANÇAMENTOS (MÁX. 5) EM LISTA LIMPA -->
      <section class="ledger-section section-ruled" aria-labelledby="recent-entries-title">
        <div class="section-header">
          <h2 id="recent-entries-title" class="section-kicker-title">ÚLTIMOS LANÇAMENTOS</h2>
          <button type="button" class="link-btn" data-action="go-tab" data-tab="historico">
            <span>Histórico completo</span>

          </button>

        ${

            ? renderEmptyState({
                title: 'Página em branco no seu Livro-Razão',
                description: 'Comece registrando sua primeira entrada, saída ou transferência no botão "+" abaixo.',
                actionLabel: 'Fazer primeiro lançamento',
                actionName: 'open-entry-sheet'
              })
            : `<div class="ledger-sheet">
                 ${recentEntries
                   .map((entry, idx) => {
                     const prevDate = idx > 0 ? recentEntries[idx - 1].data : null;
                     return renderLedgerRow(entry, {
                       accountsMap,
                       categoriesMap,
                       hideValues,
                       showMarginDate: entry.data !== prevDate,
                       staggerIndex: idx
                     });
                   })
                   .join('')}
               </div>`
        }
          </section>
        </div>
      </div>
    </section>
  `;
}

/**
 * RAZÃO — Tela de Histórico do Livro-Razão (ui/history.js)
 * Redesign Parte 2 & Correção B3:
 * - Busca sempre visível + botão "Filtros" com contador de filtros ativos que abre uma folha inferior (Bottom Sheet).
 * - Chips removíveis para cada filtro ativo.
 * - Cabeçalhos de dia fixos (sticky) com saldo do dia.
 * - Sem botão "×" permanente na linha: tocar na linha abre a folha de edição onde ficam Editar e Excluir.
 * - Rolagem fluida em lotes para 5.000+ lançamentos.
 */
const HISTORY_BATCH_SIZE = 80;

/**
 * Filtra a lista de lançamentos de acordo com os critérios ativos na store.
 */
function filterEntries(entries, filters, selectedMonth) {
  const q = String(filters.query || '').trim().toLowerCase();
  const minDate30d = addDaysISO(todayISO(), -30);

  return entries.filter((e) => {
    if (!e) return false;

    if (filters.period === 'month' && getMonthKey(e.data) !== selectedMonth) {
      return false;
    }
    if (filters.period === '30d' && e.data < minDate30d) {
      return false;
    }
    if (filters.period === 'custom') {
      if (filters.startDate && e.data < filters.startDate) return false;
      if (filters.endDate && e.data > filters.endDate) return false;
    }

    if (filters.accountId && filters.accountId !== 'all') {
      if (e.contaId !== filters.accountId && e.contaDestinoId !== filters.accountId) {
        return false;
      }
    }

    if (filters.categoryId && filters.categoryId !== 'all') {
      if (e.categoriaId !== filters.categoryId) return false;
    }

    if (filters.type && filters.type !== 'all') {
      if (e.tipo !== filters.type) return false;
    }

    if (typeof filters.minCents === 'number' && filters.minCents > 0) {
      if (e.valor < filters.minCents) return false;
    }

    if (typeof filters.maxCents === 'number' && filters.maxCents > 0) {
      if (e.valor > filters.maxCents) return false;
    }

    if (q) {
      const descMatch = String(e.descricao || '').toLowerCase().includes(q);
      const obsMatch = String(e.observacao || '').toLowerCase().includes(q);
      const tagMatch = Array.isArray(e.etiquetas) && e.etiquetas.some((t) => t.toLowerCase().includes(q));
      if (!descMatch && !obsMatch && !tagMatch) return false;
    }

    return true;
  });
}

/**
 * Calcula os chips de filtros ativos (exceto texto de busca) para exibição rápida e remoção com 1 toque.
 */
function buildActiveFilterChips(filters, accountsMap, categoriesMap, selectedMonth) {
  const chips = [];
  if (filters.period && filters.period !== 'all') {
    const label =
      filters.period === 'month'
        ? `Mês: ${selectedMonth}`
        : filters.period === '30d'
        ? 'Últimos 30 dias'
        : `Período: ${filters.startDate || '...'} a ${filters.endDate || '...'}`;
    chips.push({ key: 'period', label });
  }
  if (filters.type && filters.type !== 'all') {
    const mapType = { entrada: 'Entradas', saida: 'Saídas', transferencia: 'Transferências' };
    chips.push({ key: 'type', label: `Tipo: ${mapType[filters.type] || filters.type}` });
  }
  if (filters.accountId && filters.accountId !== 'all') {
    const acc = accountsMap.get(filters.accountId);
    chips.push({ key: 'accountId', label: `Conta: ${acc ? acc.nome : filters.accountId}` });
  }
  if (filters.categoryId && filters.categoryId !== 'all') {
    const cat = categoriesMap.get(filters.categoryId);
    chips.push({ key: 'categoryId', label: `Categoria: ${cat ? cat.nome : filters.categoryId}` });
  }
  if (typeof filters.minCents === 'number' && filters.minCents > 0) {
    chips.push({ key: 'minCents', label: `Mín: ${formatBRL(filters.minCents)}` });
  }
  if (typeof filters.maxCents === 'number' && filters.maxCents > 0) {
    chips.push({ key: 'maxCents', label: `Máx: ${formatBRL(filters.maxCents)}` });
  }
  return chips;
}

/**
 * Renderiza a tela de Histórico com barra de busca fixa, botão "Filtros (N)", chips removíveis e grupos sticky.
 */
function renderHistoryScreen(state, visibleLimit = HISTORY_BATCH_SIZE, isFilterSheetOpen = false) {
  const { entries, accounts, categories, filters, selectedMonth, settings } = state;

  const filtered = filterEntries(entries, filters, selectedMonth);
  const sliced = filtered.slice(0, visibleLimit);

  const activeChips = buildActiveFilterChips(filters, accountsMap, categoriesMap, selectedMonth);

  // Calcula saldo líquido de cada dia para exibir no cabeçalho sticky
  const dayNetMap = new Map();
  for (let i = 0; i < filtered.length; i++) {
    const e = filtered[i];
    const prev = dayNetMap.get(e.data) || 0;
    if (e.tipo === 'entrada') dayNetMap.set(e.data, prev + e.valor);
    else if (e.tipo === 'saida') dayNetMap.set(e.data, prev - e.valor);
    else dayNetMap.set(e.data, prev);

  // Agrupa os itens visíveis por data
  const groups = [];

    const item = sliced[i];

      groups.push({ date: item.data, items: [item] });

      lastGroup.items.push(item);

  const minValStr = filters.minCents ? formatDecimalBRL(filters.minCents) : '';

  let staggerCounter = 0;

  return `

      ${
        activeChips.length > 0 || filters.query
          ? `<div class="active-filter-chips" aria-label="Filtros ativos">
               ${activeChips

                   (chip) => `

                       ${getIconSVG('close')}

                   `
                 )
                 .join('')}
               <button type="button" class="clear-all-filters-link" data-action="reset-filters">Limpar tudo</button>
             </div>`
          : ''
      }

      <!-- Linha do Tempo com Cabeçalhos de Dia Fixos (Sticky) -->
      ${
        groups.length === 0
          ? renderEmptyState({
              title: entries.length === 0 ? 'Nenhum lançamento no Livro-Razão' : 'Nenhum lançamento corresponde aos filtros',
              description:
                entries.length === 0

                  : 'Remova um dos chips de filtro acima ou altere o termo pesquisado.',

              actionName: entries.length === 0 ? 'open-entry-sheet' : 'reset-filters'
            })
          : `<div class="ledger-timeline" id="history-timeline-list">
               ${groups
                 .map((g) => {
                   const margin = formatLedgerMarginDate(g.date);
                   const dayNet = dayNetMap.get(g.date) || 0;
                   return `
                     <div class="ledger-day-group">
                       <div class="ledger-day-header is-sticky-day">
                         <span class="day-header-date">${escapeHTML(margin.fullLabel)} · ${escapeHTML(g.date.slice(0, 4))}</span>

                       </div>
                       <div class="ledger-sheet">

                           .map((entry, idx) => {
                             const rowHtml = renderLedgerRow(entry, {
                               accountsMap,
                               categoriesMap,
                               hideValues,
                               showMarginDate: idx === 0,
                               staggerIndex: staggerCounter
                             });
                             staggerCounter++;
                             return rowHtml;
                           })
                           .join('')}
                       </div>

                   `;
                 })
                 .join('')}
             </div>`
      }

      ${

                         <option value="entrada" ${filters.type === 'entrada' ? 'selected' : ''}>Apenas Entradas</option>
                         <option value="saida" ${filters.type === 'saida' ? 'selected' : ''}>Apenas Saídas</option>

                       </select>
                     </label>

                     <label class="filter-field">
                       <span class="filter-label">Conta</span>

                     </label>
                   </div>

                   ${
                     filters.period === 'custom'
                       ? `<div class="filters-custom-row">
                            <label class="filter-field">
                              <span class="filter-label">Data inicial</span>

    </section>
  `;
}

                ? `<label class="sheet-field">
                     <span class="field-kicker">CONTA DE DESTINO</span>
                     <select name="contaDestinoId" id="entry-dest-account-select" class="ledger-select">
                       ${activeAccounts
                         .map(
                           (a) =>
                             `<option value="${escapeHTML(a.id)}" ${a.id === selectedDestAccId ? 'selected' : ''}>${escapeHTML(a.nome)}</option>`
                         )
                         .join('')}
                     </select>
                   </label>`
                : `<label class="sheet-field">
                     <span class="field-kicker">DATA</span>
                     <input type="date" name="data" id="entry-date-input" class="ledger-input" value="${escapeHTML(draft.data || todayISO())}" required />
                   </label>`
            }
          </div>

          ${
            tipo === 'transferencia'
              ? `<div class="sheet-row-1col">
                   <label class="sheet-field">
                     <span class="field-kicker">DATA DA TRANSFERÊNCIA</span>
                     <input type="date" name="data" id="entry-date-input" class="ledger-input" value="${escapeHTML(draft.data || todayISO())}" required />
                   </label>
                 </div>`
              : ''
          }

          <!-- Descrição -->
          <div class="sheet-row-1col">
            <label class="sheet-field">
              <span class="field-kicker">DESCRIÇÃO NA LINHA DO RAZÃO</span>
              <input
                type="text"
                name="descricao"
                id="entry-desc-input"
                class="ledger-input"
                placeholder="${tipo === 'transferencia' ? 'Ex.: Reserva para poupança' : 'Ex.: Almoço, Mercado, Salário (opcional: usa a categoria)'}"
                maxlength="140"
                value="${escapeHTML(draft.descricao || '')}"
              />
            </label>
          </div>

          <!-- Detalhes Extras: Parcelamento (SOMENTE para Saída - B2), Etiquetas e Observação -->
          <details class="sheet-advanced-details" ${isEditing || (draft.installments && draft.installments > 1) ? 'open' : ''}>
            <summary class="advanced-summary">Mais opções (${tipo === 'saida' && !isEditing ? 'parcelamento, ' : ''}etiquetas, observação)</summary>
            <div class="advanced-body">
              ${
                !isEditing && tipo === 'saida'
                  ? `<label class="sheet-field">
                       <span class="field-kicker">PARCELAR COMPRA EM (CENTAVOS SEM SOBRA)</span>
                       <select name="installments" id="entry-installments-select" class="ledger-select">
                         <option value="1">À vista (1x)</option>
                         ${[2, 3, 4, 5, 6, 8, 10, 12, 18, 24]
                           .map(
                             (n) =>
                               `<option value="${n}" ${Number(draft.installments) === n ? 'selected' : ''}>${n}x parcelas mensais</option>`
                           )
                           .join('')}
                       </select>
                     </label>`
                  : ''
              }

              <label class="sheet-field">
                <span class="field-kicker">ETIQUETAS (SEPARADAS POR VÍRGULA)</span>
                <input
                  type="text"
                  name="etiquetas"
                  id="entry-tags-input"
                  class="ledger-input"
                  placeholder="Ex.: viagem, fixo, reembolsavel"
                  value="${escapeHTML(Array.isArray(draft.etiquetas) ? draft.etiquetas.join(', ') : (draft.etiquetas || ''))}"
                />
              </label>

              <label class="sheet-field">
                <span class="field-kicker">OBSERVAÇÃO</span>
                <textarea
                  name="observacao"
                  id="entry-obs-input"
                  class="ledger-textarea"
                  rows="2"
                  placeholder="Anotação contábil opcional...">${escapeHTML(draft.observacao || '')}</textarea>
              </label>
            </div>
          </details>

          ${
            isEditing
              ? `<div class="audit-trail-box">
                   <div class="audit-line">Criado em: ${escapeHTML(formatDateBR(String(draft.criadoEm || '').slice(0, 10)))}</div>
                   ${
                     draft.editadoEm
                       ? `<div class="audit-line">Última edição: ${escapeHTML(formatDateBR(String(draft.editadoEm).slice(0, 10)))} (${editHistory.length} ${editHistory.length === 1 ? 'alteração anterior' : 'alterações anteriores'})</div>`
                       : ''
                   }
                   ${
                     editHistory.length > 0
                       ? `<ul class="audit-history-list">
                            ${editHistory
                              .slice(-3)
                              .map(
                                (h) =>
                                  `<li>Era "${escapeHTML(h.descricaoAnterior)}" — ${escapeHTML(formatBRL(h.valorAnterior))} (${escapeHTML(formatDateBR(h.dataAnterior))})</li>`
                              )
                              .join('')}
                          </ul>`
                       : ''
                   }
                 </div>`
              : ''
          }

          <div id="entry-form-error" class="form-error-banner" role="alert" hidden></div>

          <div class="sheet-actions">
            ${
              isEditing
                ? `<button type="button" class="btn btn-danger-outline" data-action="delete-from-sheet" data-entry-id="${escapeHTML(draft.id)}">
                     ${getIconSVG('trash')}
                     <span>Excluir</span>
                   </button>`
                : ''
            }
            <button type="submit" class="btn btn-primary btn-lg btn-submit-entry" id="entry-submit-btn">
              ${getIconSVG('check')}
              <span>${isEditing ? 'Salvar Alterações' : 'Registrar no Razão'}</span>
            </button>
          </div>
        </form>
      </div>
    </div>
  `;
}


// === Module: js/ui/plan.js ===
/**
 * RAZÃO — Tela Planejar com Controle Segmentado: Envelopes | Fixas | Metas (ui/plan.js)
 * Redesign Parte 2 & B4/B5:
 * - Controle segmentado no topo: Envelopes | Fixas | Metas (evita rolagem longa).
 * - Envelopes ordenados por risco (maior % consumido primeiro), com barra animada e cor por nível.
 * - Campos de valor com máscara monetária ao vivo (data-money-mask="true").
 */
function renderPlanScreen(state, activePlanSection = 'envelopes') {
  const { categories, accounts, entries, envelopes, recurrences, goals, selectedMonth, settings } = state;
  const hideValues = Boolean(settings.hideValues);

  const expenseCategories = categories.filter((c) => !c.arquivada && c.tipo === 'saida');
  const activeAccounts = accounts.filter((a) => !a.arquivada);

  const envelopeList = calculateEnvelopesStatus(envelopes, entries, categories, selectedMonth);
  const monthRecurrences = getRecurrencesForMonth(recurrences, entries, selectedMonth);
  const evaluatedGoals = goals.map((g) => evaluateSavingsGoal(g, todayISO()));

  const section = ['envelopes', 'fixas', 'metas'].includes(activePlanSection) ? activePlanSection : 'envelopes';

  return `
    <section class="ledger-page" aria-labelledby="plan-heading">
      <div class="page-top-bar">
        <h1 id="plan-heading" class="page-serif-title">Planejamento</h1>
      </div>

      ${renderMonthNavigator(selectedMonth)}

      <!-- Controle Segmentado no Topo: Envelopes | Fixas | Metas -->
      <div class="type-segmented plan-segmented" role="tablist" aria-label="Seções de planejamento">
        <button
          type="button"
          role="tab"
          aria-selected="${section === 'envelopes'}"
          class="seg-btn ${section === 'envelopes' ? 'is-active' : ''}"
          data-action="set-plan-section"
          data-plan-section="envelopes">
          Envelopes (${envelopeList.length})
        </button>
        <button
          type="button"
          role="tab"
          aria-selected="${section === 'fixas'}"
          class="seg-btn ${section === 'fixas' ? 'is-active' : ''}"
          data-action="set-plan-section"
          data-plan-section="fixas">
          Fixas (${monthRecurrences.length})
        </button>
        <button
          type="button"
          role="tab"
          aria-selected="${section === 'metas'}"
          class="seg-btn ${section === 'metas' ? 'is-active' : ''}"
          data-action="set-plan-section"
          data-plan-section="metas">
          Metas (${evaluatedGoals.length})
        </button>
      </div>

      <!-- ABA 1: ENVELOPES ORDENADOS POR RISCO -->
      ${
        section === 'envelopes'
          ? `<section class="ledger-section" aria-labelledby="envelopes-title">
               <div class="section-header">
                 <div>
                   <h2 id="envelopes-title" class="section-title">Envelopes de Gasto Mensal</h2>
                   <p class="section-subtitle">Ordenados por nível de risco com alertas automáticos em 80% e 100%.</p>
                 </div>
               </div>

               ${
                 envelopeList.length === 0
                   ? renderEmptyState({
                       title: 'Nenhum envelope configurado',
                       description: 'Defina tetos mensais para suas categorias (ex.: Mercado, Lazer) usando o formulário abaixo.'
                     })
                   : `<div class="envelopes-list">
                        ${envelopeList
                          .map((env) => {
                            const barWidth = Math.min(100, env.percentual);
                            let statusBadge = 'Sob controle';
                            if (env.nivelAlerta === 'danger') statusBadge = 'Limite excedido (100%+)';
                            else if (env.nivelAlerta === 'warning') statusBadge = 'Risco elevado (80%+)';

                            return `
                              <article class="envelope-card is-${env.nivelAlerta}">
                                <div class="envelope-card-header">
                                  <div class="envelope-title-wrap">
                                    <span class="legend-dot" style="background:${escapeHTML(env.categoriaCor)}"></span>
                                    <strong class="envelope-cat-name">${escapeHTML(env.categoriaNome)}</strong>
                                    <span class="envelope-badge is-${env.nivelAlerta}">${escapeHTML(statusBadge)}</span>
                                  </div>
                                  <button type="button" class="icon-btn-sm" data-action="delete-envelope" data-envelope-id="${escapeHTML(env.id)}" aria-label="Remover envelope ${escapeHTML(env.categoriaNome)}" title="Remover envelope">
                                    ${getIconSVG('trash')}
                                  </button>
                                </div>

                                <div class="envelope-progress-track" role="progressbar" aria-valuenow="${env.percentual}" aria-valuemin="0" aria-valuemax="100">
                                  <div class="envelope-progress-fill is-${env.nivelAlerta}" style="width: ${barWidth}%"></div>
                                </div>

                                <div class="envelope-card-footer">
                                  <span>Consumido: <strong>${displayMoney(env.gasto, hideValues)}</strong> (${env.percentual}%)</span>
                                  <span>
                                    ${
                                      env.excesso > 0
                                        ? `<span class="is-expense">Excedido em ${displayMoney(env.excesso, hideValues)}</span>`
                                        : `Restam ${displayMoney(env.restante, hideValues)} de ${displayMoney(env.limite, hideValues)}`
                                    }
                                  </span>
                                </div>
                              </article>
                            `;
                          })
                          .join('')}
                      </div>`
               }

               <form id="envelope-form" class="inline-creation-form" novalidate>
                 <h3 class="form-mini-title">Definir ou Atualizar Envelope</h3>
                 <div class="form-row-grid">
                   <label class="filter-field">
                     <span class="filter-label">Categoria de Saída</span>
                     <select name="categoriaId" class="ledger-select" required>
                       ${expenseCategories
                         .map((c) => `<option value="${escapeHTML(c.id)}">${escapeHTML(c.nome)}</option>`)
                         .join('')}
                     </select>
                   </label>
                   <label class="filter-field">
                     <span class="filter-label">Limite Mensal (R$)</span>
                     <input type="text" inputmode="decimal" data-money-mask="true" name="limiteInput" class="ledger-input" placeholder="1.200,00" required />
                   </label>
                   <div class="form-btn-cell">
                     <button type="submit" class="btn btn-primary btn-block">Salvar Envelope</button>
                   </div>
                 </div>
               </form>
             </section>`
          : ''
      }

      <!-- ABA 2: CONTAS FIXAS E RECORRÊNCIAS -->
      ${
        section === 'fixas'
          ? `<section class="ledger-section" aria-labelledby="recurrences-title">
               <div class="section-header">
                 <div>
                   <h2 id="recurrences-title" class="section-title">Contas Fixas e Recorrências</h2>
                   <p class="section-subtitle">Vencimentos previstos em ${escapeHTML(selectedMonth)} (dia 31 ajusta-se em meses curtos).</p>
                 </div>
               </div>

               ${
                 monthRecurrences.length === 0
                   ? renderEmptyState({
                       title: 'Nenhuma recorrência cadastrada',
                       description: 'Cadastre aluguel, internet, assinatura ou salário fixo para prever seu Saldo Livre.'
                     })
                   : `<div class="recurrences-list">
                        ${monthRecurrences
                          .map(
                            (item) => `
                              <div class="recurrence-row ${item.confirmada ? 'is-confirmed' : ''}">
                                <div class="recurrence-main">
                                  <span class="upcoming-date">${escapeHTML(formatDateBR(item.dataVencimento).slice(0, 5))}</span>
                                  <div>
                                    <div class="upcoming-desc">
                                      ${escapeHTML(item.descricao)}
                                      <span class="freq-tag">${escapeHTML(item.frequencia)}</span>
                                    </div>
                                    <div class="upcoming-val ${item.tipo === 'entrada' ? 'is-income' : 'is-expense'}">
                                      ${displayMoney(item.valor, hideValues)}
                                    </div>
                                  </div>
                                </div>
                                <div class="recurrence-actions">
                                  ${
                                    item.confirmada
                                      ? `<span class="confirmed-pill">${getIconSVG('check')} Lançado</span>`
                                      : `<button type="button" class="btn btn-sm btn-confirm-bill" data-action="confirm-recurrence" data-instance-key="${escapeHTML(item.instanceKey)}">
                                           ${getIconSVG('check')}
                                           <span>Confirmar</span>
                                         </button>`
                                  }
                                  <button type="button" class="icon-btn-sm" data-action="delete-recurrence" data-recurrence-id="${escapeHTML(item.recorrenciaId)}" aria-label="Excluir regra recorrente ${escapeHTML(item.descricao)}">
                                    ${getIconSVG('trash')}
                                  </button>
                                </div>
                              </div>
                            `
                          )
                          .join('')}
                      </div>`
               }

               <form id="recurrence-form" class="inline-creation-form" novalidate>
                 <h3 class="form-mini-title">Nova Conta Fixa ou Recorrência</h3>
                 <div class="form-row-grid">
                   <label class="filter-field">
                     <span class="filter-label">Descrição</span>
                     <input type="text" name="descricao" class="ledger-input" placeholder="Ex.: Aluguel, Condomínio, Internet" required />
                   </label>
                   <label class="filter-field">
                     <span class="filter-label">Valor (R$)</span>
                     <input type="text" inputmode="decimal" data-money-mask="true" name="valorInput" class="ledger-input" placeholder="350,00" required />
                   </label>
                   <label class="filter-field">
                     <span class="filter-label">Tipo</span>
                     <select name="tipo" class="ledger-select">
                       <option value="saida">Saída (Despesa)</option>
                       <option value="entrada">Entrada (Receita)</option>
                     </select>
                   </label>
                   <label class="filter-field">
                     <span class="filter-label">Frequência</span>
                     <select name="frequencia" class="ledger-select">
                       <option value="mensal">Mensal</option>
                       <option value="semanal">Semanal</option>
                       <option value="anual">Anual</option>
                     </select>
                   </label>
                   <label class="filter-field">
                     <span class="filter-label">Dia de Vencimento (1–31)</span>
                     <input type="number" name="diaVencimento" class="ledger-input" min="1" max="31" value="10" required />
                   </label>
                   <label class="filter-field">
                     <span class="filter-label">Conta</span>
                     <select name="contaId" class="ledger-select">
                       ${activeAccounts.map((a) => `<option value="${escapeHTML(a.id)}">${escapeHTML(a.nome)}</option>`).join('')}
                     </select>
                   </label>
                   <label class="filter-field">
                     <span class="filter-label">Categoria</span>
                     <select name="categoriaId" class="ledger-select">
                       ${categories
                         .filter((c) => !c.arquivada)
                         .map((c) => `<option value="${escapeHTML(c.id)}">${escapeHTML(c.nome)}</option>`)
                         .join('')}
                     </select>
                   </label>
                   <div class="form-btn-cell">
                     <button type="submit" class="btn btn-primary btn-block">Adicionar Fixa</button>
                   </div>
                 </div>
               </form>
             </section>`
          : ''
      }

      <!-- ABA 3: METAS DE ECONOMIA -->
      ${
        section === 'metas'
          ? `<section class="ledger-section" aria-labelledby="goals-title">
               <div class="section-header">
                 <div>
                   <h2 id="goals-title" class="section-title">Metas de Economia</h2>
                   <p class="section-subtitle">Acompanhe o progresso e a data estimada de conclusão.</p>
                 </div>
               </div>

               ${
                 evaluatedGoals.length === 0
                   ? renderEmptyState({
                       title: 'Nenhuma meta criada',
                       description: 'Planeje sua reserva de emergência ou objetivo futuro com cálculo automático de conclusão.'
                     })
                   : `<div class="goals-list">
                        ${evaluatedGoals
                          .map(
                            (g) => `
                              <article class="goal-card">
                                <div class="envelope-card-header">
                                  <div class="envelope-title-wrap">
                                    <strong class="envelope-cat-name">${escapeHTML(g.nome)}</strong>
                                    <span class="goal-forecast-pill">
                                      ${
                                        g.mesesRestantes === 0
                                          ? 'Meta concluída!'
                                          : g.dataPrevisaoISO
                                          ? `Previsão: ${escapeHTML(formatDateBR(g.dataPrevisaoISO))} (~${g.mesesRestantes} ${g.mesesRestantes === 1 ? 'mês' : 'meses'})`
                                          : 'Defina um aporte mensal para prever a data'
                                      }
                                    </span>
                                  </div>
                                  <button type="button" class="icon-btn-sm" data-action="delete-goal" data-goal-id="${escapeHTML(g.id)}" aria-label="Remover meta ${escapeHTML(g.nome)}">
                                    ${getIconSVG('trash')}
                                  </button>
                                </div>

                                <div class="envelope-progress-track" role="progressbar" aria-valuenow="${g.percentual}" aria-valuemin="0" aria-valuemax="100">
                                  <div class="envelope-progress-fill is-ok" style="width: ${g.percentual}%"></div>
                                </div>

                                <div class="envelope-card-footer">
                                  <span>Guardado: <strong>${displayMoney(g.valorAtual, hideValues)}</strong> (${g.percentual}%)</span>
                                  <span>Alvo: <strong>${displayMoney(g.valorAlvo, hideValues)}</strong> · Aporte: ${displayMoney(g.aporteMensal, hideValues)}/mês</span>
                                </div>
                              </article>
                            `
                          )
                          .join('')}
                      </div>`
               }

               <form id="goal-form" class="inline-creation-form" novalidate>
                 <h3 class="form-mini-title">Criar Nova Meta</h3>
                 <div class="form-row-grid">
                   <label class="filter-field">
                     <span class="filter-label">Nome da Meta</span>
                     <input type="text" name="nome" class="ledger-input" placeholder="Ex.: Reserva de Emergência" required />
                   </label>
                   <label class="filter-field">
                     <span class="filter-label">Valor Alvo (R$)</span>
                     <input type="text" inputmode="decimal" data-money-mask="true" name="valorAlvoInput" class="ledger-input" placeholder="15.000,00" required />
                   </label>
                   <label class="filter-field">
                     <span class="filter-label">Já Guardado (R$)</span>
                     <input type="text" inputmode="decimal" data-money-mask="true" name="valorAtualInput" class="ledger-input" placeholder="3.000,00" value="0,00" />
                   </label>
                   <label class="filter-field">
                     <span class="filter-label">Aporte Mensal Planejado (R$)</span>
                     <input type="text" inputmode="decimal" data-money-mask="true" name="aporteMensalInput" class="ledger-input" placeholder="1.000,00" required />
                   </label>
                   <div class="form-btn-cell">
                     <button type="submit" class="btn btn-primary btn-block">Salvar Meta</button>
                   </div>
                 </div>
               </form>
             </section>`
          : ''
      }
    </section>
  `;
}


// === Module: js/ui/analytics.js ===
/**
 * RAZÃO — Tela de Análises e Gráficos SVG Artesanais (ui/analytics.js)
 * Regras:
 * - Resumo mensal: entradas, saídas, resultado, comparação com o mês anterior e top categorias.
 * - 3 gráficos SVG feitos à mão: rosca por categoria, barras diárias e linha de saldo acumulado.
 * - Tooltips interativos por toque/clique e rótulos acessíveis.
 */
function renderAnalyticsScreen(state) {
  const { accounts, entries, categories, selectedMonth, settings } = state;
  const hideValues = Boolean(settings.hideValues);

  const summary = calculateMonthlySummary({
    accounts,
    entries,
    categories,
    monthKey: selectedMonth
  });

  let comparisonLabel = 'Sem base no mês anterior para comparação percentual';
  if (summary.expenseChangePct !== null) {
    if (summary.expenseChangePct === 0) {
      comparisonLabel = 'Saídas estáveis (0%) em relação ao mês anterior';
    } else if (summary.expenseChangePct > 0) {
      comparisonLabel = `+${summary.expenseChangePct}% nas saídas em relação ao mês anterior`;
    } else {
      comparisonLabel = `${summary.expenseChangePct}% nas saídas (economia frente ao mês anterior)`;
    }
  }

  return `
    <section class="ledger-page" aria-labelledby="analytics-heading">
      <div class="page-top-bar">
        <h1 id="analytics-heading" class="page-serif-title">Análises do Mês</h1>
      </div>

      ${renderMonthNavigator(selectedMonth)}

      <!-- Item 3: Topo em grade 2 colunas (Entradas | Saídas) e Resultado Líquido em faixa de largura total abaixo -->
      <div class="analytics-kpi-grid">
        <div class="kpi-box">
          <span class="kpi-label">Entradas</span>
          <span class="kpi-val is-income">${displayMoney(summary.entradas, hideValues)}</span>
          <span class="kpi-sub">Mês ant.: ${displayMoney(summary.prevEntradas, hideValues)}</span>
        </div>
        <div class="kpi-box">
          <span class="kpi-label">Saídas</span>
          <span class="kpi-val is-expense">${displayMoney(summary.saidas, hideValues)}</span>
          <span class="kpi-sub">Mês ant.: ${displayMoney(summary.prevSaidas, hideValues)}</span>
        </div>
        <div class="kpi-box kpi-box-full">
          <div>
            <span class="kpi-label">Resultado Líquido</span>
            <div class="kpi-sub">${escapeHTML(comparisonLabel)}</div>
          </div>
          <span class="kpi-val ${summary.resultado >= 0 ? 'is-income' : 'is-expense'}">${displayMoney(summary.resultado, hideValues, { showSign: true })}</span>
        </div>
      </div>

      <div class="analytics-charts-grid">
        <!-- Gráfico 1: Para onde foi o dinheiro -->
        <section class="ledger-section chart-card" aria-labelledby="chart-donut-title">
          <div class="section-header">
            <h2 id="chart-donut-title" class="section-title">Para onde foi o dinheiro</h2>
          </div>
          <div id="chart-touch-tooltip" class="chart-inline-hint" role="status" aria-live="polite">
            Toque numa categoria ou barra para ver detalhes
          </div>
          ${renderCategoryDonutSVG(summary.topCategories, summary.saidas, hideValues)}
        </section>

        <!-- Gráfico 2: Movimento Diário -->
        <section class="ledger-section chart-card" aria-labelledby="chart-bars-title">
          <div class="section-header">
            <h2 id="chart-bars-title" class="section-title">Receitas e despesas por dia</h2>
            <span class="section-meta">Verde: Receita · Terracota: Despesa</span>
          </div>
          ${renderDailyBarsSVG(summary.dailySeries, hideValues)}
        </section>

        <!-- Gráfico 3: Evolução do Saldo -->
        <section class="ledger-section chart-card chart-card-wide" aria-labelledby="chart-line-title">
          <div class="section-header">
            <h2 id="chart-line-title" class="section-title">Evolução do saldo no mês</h2>
            <span class="section-meta">Início do mês: ${displayMoney(summary.openingBalance, hideValues)}</span>
          </div>
          ${renderCumulativeBalanceLineSVG(summary.dailySeries, hideValues)}
        </section>
      </div>
    </section>
  `;
}

/**

/**
 * RAZÃO — Suite Obrigatória de Testes Técnicos e de Regressão B1–B8 (js/tests.js)
 * Parte 3:
 * - Inclui todos os 14 testes originais + 5 novos testes de regressão exigidos:
 *   15. Regressão B1/B2 (DOM): Simula clique nos botões "Entrada" e "Transferência" dentro da .bottom-sheet
 *       e confere que o evento propaga até o document, preserva o valor digitado e salva com o tipo correto.
 *   16. Regressão B2 (Contábil): Confere que Transferência entre contas NÃO conta como entrada nem saída do mês
 *       no calculateMonthlySummary, movendo apenas o saldo entre contas.
 *   17. Regressão B1 (Botão ✕): Simula clique no botão ✕ (close-entry-sheet-btn) dentro da .bottom-sheet
 *       e confere que a folha fecha imediatamente.
 *   18. Regressão B5 (Máscara Monetária): Verifica que digitar "123456" formata ao vivo para "1.234,56".
 *   19. Regressão B2 (Parcelamento restrito a Saída): Confere que na folha de lançamento o seletor de parcelas
 *       só é exibido quando tipo === 'saida'.
 */






class TestRunner {
  constructor() {
    this.results = [];
  }

  test(group, name, fn) {
    try {
      fn();
      this.results.push({ group, name, passed: true, error: null });
    } catch (err) {
      this.results.push({
        group,
        name,
        passed: false,
        error: err && err.message ? err.message : String(err)
      });
    }
  }

  assertEqual(actual, expected, msg = '') {
    const a = JSON.stringify(actual);
    const e = JSON.stringify(expected);
    if (a !== e) {
      throw new Error(`${msg ? msg + ' — ' : ''}Esperado: ${e}, Obtido: ${a}`);
    }
  }

  assertTrue(cond, msg = 'Condição deveria ser verdadeira') {
    if (!cond) throw new Error(msg);
  }
}
function runAllTests() {
  const r = new TestRunner();

  // 1. Conversão e formatação de dinheiro
  r.test('1. Dinheiro & Centavos', 'Soma exata de 0,10 + 0,20 em centavos inteiros sem erro de float (10 + 20 = 30)', () => {
    const a = parseMoneyInput('0,10');
    const b = parseMoneyInput('0,20');
    r.assertTrue(a.ok && b.ok);
    const soma = sumCents([a.cents, b.cents]);
    r.assertEqual(soma, 30);
    r.assertEqual(formatBRL(soma), 'R$ 0,30');
  });

  r.test('1. Dinheiro & Centavos', 'Aceita "1.234,56", "1234,56" e "1234.56" convertendo para 123456 centavos', () => {
    const p1 = parseMoneyInput('1.234,56');
    const p2 = parseMoneyInput('1234,56');
    const p3 = parseMoneyInput('1234.56');
    r.assertEqual(p1, { ok: true, cents: 123456 });
    r.assertEqual(p2, { ok: true, cents: 123456 });
    r.assertEqual(p3, { ok: true, cents: 123456 });
    r.assertEqual(formatBRL(123456), 'R$ 1.234,56');
  });

  r.test('1. Dinheiro & Centavos', 'Suporta valores gigantes (bilhões de reais) com precisão inteira', () => {
    const giant = parseMoneyInput('9.876.543.210,99');
    r.assertTrue(giant.ok);
    r.assertEqual(giant.cents, 987654321099);
    r.assertEqual(formatBRL(giant.cents), 'R$ 9.876.543.210,99');
  });

  r.test('1. Dinheiro & Centavos', 'Rejeita vazio, zero, negativo e texto inválido com mensagem clara em português', () => {
    r.assertEqual(parseMoneyInput('').ok, false);
    r.assertEqual(parseMoneyInput('0,00').ok, false);
    r.assertEqual(parseMoneyInput('-50,00').ok, false);
    r.assertEqual(parseMoneyInput('abc').ok, false);
    r.assertEqual(parseMoneyInput('12,345').ok, false);
  });

  // 2. Divisão de parcelas
  r.test('2. Parcelamento Exato', 'Divide R$ 100,00 (10000 centavos) em 3x como [3334, 3333, 3333] sem sobra nem falta', () => {
    const parts = splitInstallments(10000, 3);
    r.assertEqual(parts, [3334, 3333, 3333]);
    r.assertEqual(sumCents(parts), 10000);
  });

  r.test('2. Parcelamento Exato', 'Gera lançamentos parcelados com datas mensais subsequentes e soma idêntica ao total', () => {
    const accounts = getDefaultAccounts();
    const categories = getDefaultCategories();
    const built = buildInstallmentEntries(
      {
        tipo: 'saida',
        valorInput: '100,00',
        data: '2026-01-31',
        contaId: 'acc_cartao',
        categoriaId: 'cat_lazer',
        descricao: 'Compra Parcelada'
      },
      3,
      { accounts, categories }
    );
    r.assertTrue(built.ok);
    r.assertEqual(built.entries.length, 3);
    r.assertEqual(built.entries.map((e) => e.valor), [3334, 3333, 3333]);
    r.assertEqual(built.entries.map((e) => e.data), ['2026-01-31', '2026-02-28', '2026-03-31']);
  });

  // 3. Datas
  r.test('3. Datas & Calendário Local', 'Trata corretamente ano bissexto (29/02/2024 válido, 29/02/2025 inválido)', () => {
    r.assertTrue(isValidISODate('2024-02-29'));
    r.assertEqual(isValidISODate('2025-02-29'), false);
    r.assertEqual(getDaysInMonth(2024, 2), 29);
    r.assertEqual(getDaysInMonth(2026, 2), 28);
  });

  r.test('3. Datas & Calendário Local', 'Ajusta dia 31 em meses curtos e na virada de ano sem bug de fuso horário', () => {
    r.assertEqual(addMonthsISO('2026-01-31', 1, 31), '2026-02-28');
    r.assertEqual(addMonthsISO('2024-01-31', 1, 31), '2024-02-29');
    r.assertEqual(addMonthsISO('2026-03-31', 1, 31), '2026-04-30');
    r.assertEqual(addMonthsISO('2026-12-31', 1, 31), '2027-01-31');
    r.assertEqual(getClampedDateInMonth(31, '2026-11'), '2026-11-30');
    r.assertEqual(formatDateBR('2026-11-06'), '06/11/2026');
    r.assertEqual(diffDaysISO('2026-11-01', '2026-11-06'), 5);
  });

  // 4. Saldos, Transferências e Saldo Livre
  r.test('4. Saldos, Transferências e Saldo Livre', 'Calcula saldos a partir dos lançamentos e não conta transferência como receita/despesa', () => {
    const accounts = getDefaultAccounts();
    const categories = getDefaultCategories();
    const entries = [
      { id: '1', tipo: 'entrada', valor: 500000, data: '2026-11-01', contaId: 'acc_corrente', categoriaId: 'cat_salario', descricao: 'Salário' },
      { id: '2', tipo: 'saida', valor: 100000, data: '2026-11-02', contaId: 'acc_corrente', categoriaId: 'cat_mercado', descricao: 'Mercado' },
      { id: '3', tipo: 'transferencia', valor: 150000, data: '2026-11-03', contaId: 'acc_corrente', contaDestinoId: 'acc_poupanca', descricao: 'Reserva' }
    ];

    const bal = calculateAccountBalances(accounts, entries);
    r.assertEqual(bal.byAccount.acc_corrente, 250000);
    r.assertEqual(bal.byAccount.acc_poupanca, 150000);
    r.assertEqual(bal.totalBalance, 400000);

    const recurrences = [
      { id: 'rec1', descricao: 'Aluguel', tipo: 'saida', valor: 100000, diaVencimento: 20, frequencia: 'mensal', contaId: 'acc_corrente', categoriaId: 'cat_moradia', ativa: true }
    ];

    const free = calculateFreeBalance({
      accounts,
      entries,
      envelopes: [],
