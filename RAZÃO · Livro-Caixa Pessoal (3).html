<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#141413" />
  <meta name="description" content="RAZÃO — Livro-caixa digital de finanças pessoais, mobile-first, 100% local e offline." />
  <title>RAZÃO · Livro-Caixa Pessoal</title>

  <!-- B6: Google Fonts com display=swap e fallback serifado clássico -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <style>
/**
 * RAZÃO — Editorial Financeiro Contemporâneo (Sistema de Design Completo)
 * Direção Criativa:
 * - Paleta Escura: Fundo #0C120F | Superfície #162019 | Elevada #202C24 | Texto #F3EFE3 / #A4AA9D | Dourado fosco #B99B69 | Verde #83AB8B | Despesas #D9826B
 * - Paleta Clara: Fundo #F1EEE5 | Superfície #FCFAF4 | Elevada #F0EBDF | Texto #242820 | Verde #315C40 | Dourado #A47E45
 * - Tipografia: Fraunces (grandes títulos e saldos) + Plus Jakarta Sans (componentes e leitura), tabular-nums.
 * - Responsividade Real:
 *   - Mobile (<768px): Barra inferior ergonômica, componentes empilhados, leitura perfeita em 360px.
 *   - Tablet (768px–1099px): Navegação lateral compacta (rail) + grades adaptáveis em 2 colunas.
 *   - Desktop (>=1100px): Menu lateral permanente (260px) + painel amplo (até 1380px) em múltiplas colunas.
 * - Sem vidro generalizado: superfícies sólidas com bordas editoriais sutis.
 */

:root {
  /* Escala de espaçamento */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --space-7: 40px;

  /* Raios */
  --radius-xs: 8px;
  --radius-sm: 12px;
  --radius-md: 16px;
  --radius-lg: 22px;

  /* Tipografia */
  --font-serif: 'Fraunces', 'Iowan Old Style', 'Palatino Linotype', 'Book Antiqua', Georgia, serif;
  --font-sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;

  /* Velocidades e Curvas de Animação */
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  --ease-smooth: cubic-bezier(0.22, 1, 0.36, 1);
  --dur-fast: 150ms;
  --dur-normal: 240ms;
  --dur-slow: 350ms;
}

:root,
[data-theme="dark"] {
  --bg-canvas: #0C120F;
  --bg-surface-1: #162019;
  --bg-surface-2: #202C24;
  --bg-surface-3: #28362D;
  --bg-page: var(--bg-surface-1);
  --bg-elevated: var(--bg-surface-2);
  --bg-subtle: var(--bg-surface-3);

  --text-primary: #F3EFE3;
  --text-secondary: #A4AA9D;
  --text-muted: #768074;

  --gold-accent: #B99B69;
  --gold-accent-soft: rgba(185, 155, 105, 0.14);
  --gold-border: rgba(185, 155, 105, 0.32);

  --color-income: #83AB8B;
  --color-income-bg: rgba(131, 171, 139, 0.14);
  --color-expense: #D9826B;
  --color-expense-bg: rgba(217, 130, 107, 0.14);
  --color-warning: #B99B69;
  --color-warning-bg: rgba(185, 155, 105, 0.15);
  --color-transfer: #8CA9B8;

  --accent-primary: #83AB8B;
  --accent-primary-hover: #94B99B;
  --accent-contrast: #0C120F;

  --border-subtle: rgba(243, 239, 227, 0.08);
  --border-strong: rgba(243, 239, 227, 0.16);
  --margin-line: rgba(185, 155, 105, 0.25);
  --ruled-line: rgba(243, 239, 227, 0.06);

  --hero-surface: linear-gradient(155deg, #1B2920 0%, #141D17 100%);
  --hero-negative-surface: linear-gradient(155deg, #281B18 0%, #161816 100%);

  --shadow-sm: 0 2px 6px rgba(0, 0, 0, 0.28);
  --shadow-card: 0 12px 32px -8px rgba(0, 0, 0, 0.52), 0 2px 6px rgba(0, 0, 0, 0.3);
  --shadow-sheet: 0 -14px 44px rgba(0, 0, 0, 0.72);
}

[data-theme="light"] {
  --bg-canvas: #F1EEE5;
  --bg-surface-1: #FCFAF4;
  --bg-surface-2: #F0EBDF;
  --bg-surface-3: #E4DEC9;
  --bg-page: var(--bg-surface-1);
  --bg-elevated: var(--bg-surface-2);
  --bg-subtle: var(--bg-surface-3);

  --text-primary: #242820;
  --text-secondary: #565C52;
  --text-muted: #767C71;

  --gold-accent: #A47E45;
  --gold-accent-soft: rgba(164, 126, 69, 0.12);
  --gold-border: rgba(164, 126, 69, 0.32);

  --color-income: #315C40;
  --color-income-bg: rgba(49, 92, 64, 0.11);
  --color-expense: #A6442C;
  --color-expense-bg: rgba(166, 68, 44, 0.11);
  --color-warning: #A47E45;
  --color-warning-bg: rgba(164, 126, 69, 0.14);
  --color-transfer: #33586B;

  --accent-primary: #315C40;
  --accent-primary-hover: #254831;
  --accent-contrast: #FCFAF4;

  --border-subtle: rgba(36, 40, 32, 0.09);
  --border-strong: rgba(36, 40, 32, 0.18);
  --margin-line: rgba(164, 126, 69, 0.26);
  --ruled-line: rgba(36, 40, 32, 0.06);

  --hero-surface: linear-gradient(155deg, #F5F1E5 0%, #FCFAF4 100%);
  --hero-negative-surface: linear-gradient(155deg, #F9ECE8 0%, #FCFAF4 100%);

  --shadow-sm: 0 2px 5px rgba(36, 40, 32, 0.05);
  --shadow-card: 0 10px 28px -8px rgba(36, 40, 32, 0.09), 0 2px 6px rgba(36, 40, 32, 0.04);
  --shadow-sheet: 0 -10px 36px rgba(36, 40, 32, 0.15);
}

*,
*::before,
*::after {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  background-color: var(--bg-canvas);
  color: var(--text-primary);
  font-family: var(--font-sans);
  font-size: 16px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
  transition: background-color var(--dur-normal) ease, color var(--dur-normal) ease;
}

/* Números tabulares em todos os indicadores monetários */
.money-value,
.hero-main-amount,
.strip-val,
.account-balance,
.upcoming-val,
.ledger-row-amount,
.kpi-val,
.margin-day,
.entries-counter-pill,
.legend-pct,
.legend-val,
.pace-ring-text,
.filter-count-badge,
input[inputmode="decimal"],
input[type="number"] {
  font-variant-numeric: tabular-nums;
  font-feature-settings: "tnum" 1;
}

:focus-visible {
  outline: 2px solid var(--gold-accent);
  outline-offset: 2px;
}

.money-value.is-blurred {
  filter: blur(6px);
  user-select: none;
}

.lucide-icon {
  flex-shrink: 0;
  display: inline-block;
  vertical-align: middle;
}

/* ==========================================================================
   ARQUITETURA RESPONSIVA: MOBILE (<768px) | TABLET (768-1099px) | DESKTOP (>=1100px)
   ========================================================================== */

.app-layout {
  min-height: 100dvh;
  width: 100%;
  display: flex;
  flex-direction: column;
  background-color: var(--bg-canvas);
}

/* Menu Lateral (Oculto no Mobile, Compacto no Tablet, Amplo no Desktop) */
.editorial-sidebar {
  display: none;
}

.app-workspace {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  padding-bottom: 98px;
}

/* Cabeçalho Mobile/Tablet */
.app-header {
  position: sticky;
  top: 0;
  z-index: 25;
  background-color: var(--bg-surface-1);
  border-bottom: 1px solid var(--border-subtle);
  padding: var(--space-3) var(--space-4);
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.brand-lockup {
  display: flex;
  align-items: baseline;
  gap: var(--space-2);
  cursor: pointer;
  min-height: 44px;
  align-items: center;
}

.brand-title {
  font-family: var(--font-serif);
  font-size: 1.38rem;
  font-weight: 700;
  letter-spacing: 0.03em;
  margin: 0;
  color: var(--text-primary);
}

.brand-subtitle {
  font-size: 0.68rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.14em;
  color: var(--gold-accent);
}

.header-actions {
  display: flex;
  align-items: center;
  gap: var(--space-2);
}

/* TABLET (768px a 1099px): Navegação Lateral Compacta + Painel Adaptável */
@media (min-width: 768px) {
  .app-layout {
    flex-direction: row;
  }

  .editorial-sidebar {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    width: 88px;
    flex-shrink: 0;
    background-color: var(--bg-surface-1);
    border-right: 1px solid var(--border-subtle);
    padding: var(--space-4) var(--space-2);
    position: sticky;
    top: 0;
    height: 100dvh;
    z-index: 30;
  }

  .sidebar-brand {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    padding-bottom: var(--space-3);
    border-bottom: 1px solid var(--border-subtle);
    cursor: pointer;
  }

  .sidebar-monogram {
    width: 44px;
    height: 44px;
    border-radius: var(--radius-sm);
    background: var(--bg-surface-2);
    border: 1px solid var(--gold-border);
    color: var(--gold-accent);
    font-family: var(--font-serif);
    font-size: 1.35rem;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .sidebar-brand-text {
    display: none;
  }

  .sidebar-launch-cta {
    margin: var(--space-3) 0;
    width: 100%;
    min-height: 48px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--gold-border);
    background: var(--accent-primary);
    color: var(--accent-contrast);
    font-family: var(--font-sans);
    font-weight: 700;
    font-size: 0.85rem;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: var(--space-2);
    cursor: pointer;
    box-shadow: var(--shadow-sm);
    transition: transform var(--dur-fast) var(--ease-out), background-color var(--dur-fast) ease;
  }

  .sidebar-launch-cta span {
    display: none;
  }

  .sidebar-nav-list {
    display: flex;
    flex-direction: column;
    gap: var(--space-1);
    flex: 1;
  }

  .sidebar-nav-btn {
    width: 100%;
    min-height: 52px;
    padding: 6px 4px;
    border-radius: var(--radius-sm);
    border: 1px solid transparent;
    background: transparent;
    color: var(--text-secondary);
    font-family: var(--font-sans);
    font-size: 0.68rem;
    font-weight: 600;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    cursor: pointer;
    transition: background-color var(--dur-fast) ease, color var(--dur-fast) ease, transform var(--dur-fast) var(--ease-out);
  }

  .sidebar-nav-btn:hover {
    background: var(--bg-surface-2);
    color: var(--text-primary);
  }

  .sidebar-nav-btn.is-active {
    background: var(--bg-surface-2);
    border-color: var(--gold-border);
    color: var(--color-income);
  }

  .sidebar-footer {
    padding-top: var(--space-3);
    border-top: 1px solid var(--border-subtle);
    font-size: 0.66rem;
    color: var(--text-muted);
    text-align: center;
  }

  .sidebar-footer-text {
    display: none;
  }

  .app-workspace {
    padding-bottom: var(--space-6);
  }

  .bottom-nav {
    display: none !important;
  }

  .ledger-page {
    max-width: 1040px;
    width: 100%;
    margin: 0 auto;
    padding: var(--space-5) var(--space-5);
  }
}

/* DESKTOP (>=1100px): Menu Lateral Permanente Completo + Painel Amplo Multi-Coluna */
@media (min-width: 1100px) {
  .editorial-sidebar {
    width: 256px;
    padding: var(--space-5) var(--space-4);
    align-items: stretch;
  }

  .sidebar-brand {
    flex-direction: row;
    justify-content: flex-start;
    gap: var(--space-3);
    padding-bottom: var(--space-4);
  }

  .sidebar-brand-text {
    display: flex;
    flex-direction: column;
  }

  .sidebar-brand-title {
    font-family: var(--font-serif);
    font-size: 1.35rem;
    font-weight: 700;
    color: var(--text-primary);
    line-height: 1.1;
  }

  .sidebar-brand-kicker {
    font-size: 0.66rem;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--gold-accent);
    margin-top: 2px;
  }

  .sidebar-launch-cta {
    padding: 0 var(--space-4);
    min-height: 50px;
    font-size: 0.92rem;
    margin: var(--space-4) 0;
  }

  .sidebar-launch-cta span {
    display: inline;
  }

  .sidebar-nav-btn {
    flex-direction: row;
    justify-content: flex-start;
    padding: 0 var(--space-3);
    min-height: 48px;
    font-size: 0.9rem;
    gap: var(--space-3);
  }

  .sidebar-footer-text {
    display: block;
    text-align: left;
    line-height: 1.4;
  }

  .ledger-page {
    max-width: 1320px;
    padding: var(--space-6) var(--space-6);
  }
}

/* ==========================================================================
   SISTEMA DE COMPONENTES EDITORIAIS (Botões, Cartões, Campos, Seletores)
   ========================================================================== */

.icon-btn {
  min-width: 44px;
  min-height: 44px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-subtle);
  background: var(--bg-surface-2);
  color: var(--text-primary);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: transform var(--dur-fast) var(--ease-out), border-color var(--dur-fast) ease, background-color var(--dur-fast) ease;
}

.icon-btn:hover {
  border-color: var(--gold-border);
}

.icon-btn:active {
  transform: scale(0.94);
}

.icon-btn.is-active {
  border-color: var(--gold-accent);
  color: var(--gold-accent);
  background: var(--gold-accent-soft);
}

.icon-btn-sm {
  min-width: 44px;
  min-height: 44px;
  border-radius: var(--radius-sm);
  border: 1px solid transparent;
  background: transparent;
  color: var(--text-secondary);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: transform var(--dur-fast) var(--ease-out), opacity var(--dur-fast) ease;
}

.icon-btn-sm:active:not(:disabled) {
  transform: scale(0.92);
}

.icon-btn-sm:disabled {
  opacity: 0.32;
  cursor: not-allowed;
}

.btn {
  min-height: 44px;
  padding: 0 var(--space-4);
  border-radius: var(--radius-sm);
  font-family: var(--font-sans);
  font-size: 0.9rem;
  font-weight: 600;
  border: 1px solid transparent;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-2);
  cursor: pointer;
  text-decoration: none;
  transition: transform var(--dur-fast) var(--ease-out), background-color var(--dur-fast) ease, border-color var(--dur-fast) ease;
}

.btn:active {
  transform: scale(0.97);
}

.btn-primary {
  background-color: var(--accent-primary);
  color: var(--accent-contrast);
}

.btn-primary:hover {
  background-color: var(--accent-primary-hover);
}

.btn-outline {
  background-color: var(--bg-surface-1);
  color: var(--text-primary);
  border-color: var(--border-strong);
}

.btn-outline:hover {
  border-color: var(--gold-border);
  background-color: var(--bg-surface-2);
}

.btn-danger-outline {
  background-color: var(--color-expense-bg);
  color: var(--color-expense);
  border-color: var(--color-expense);
}

.btn-sm {
  min-height: 44px;
  padding: 0 var(--space-3);
  font-size: 0.84rem;
}

.btn-lg {
  min-height: 50px;
  font-size: 0.98rem;
}

.btn-block {
  width: 100%;
}

.link-btn {
  min-height: 44px;
  padding: 0 var(--space-2);
  background: none;
  border: none;
  color: var(--gold-accent);
  font-family: var(--font-sans);
  font-size: 0.84rem;
  font-weight: 600;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 4px;
}

.link-btn:hover {
  color: var(--color-income);
}

/* Transição de Página e Entrada Sequencial */
.ledger-page {
  padding: var(--space-4);
  display: flex;
  flex-direction: column;
  gap: var(--space-5);
  animation: fadePageIn var(--dur-normal) var(--ease-out);
}

@keyframes fadePageIn {
  from {
    opacity: 0;
    transform: translateY(8px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.shimmer-card,
.shimmer-row {
  background: var(--bg-surface-1);
  border-radius: var(--radius-md);
  animation: pulseOpacity 1.2s ease-in-out infinite alternate;
}

.shimmer-card { height: 210px; }
.shimmer-row { height: 58px; }

@keyframes pulseOpacity {
  from { opacity: 0.45; }
  to { opacity: 0.85; }
}

.page-top-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-3);
  flex-wrap: wrap;
}

.page-serif-title {
  font-family: var(--font-serif);
  font-size: clamp(1.45rem, 3vw, 1.85rem);
  font-weight: 700;
  margin: 0;
  letter-spacing: -0.01em;
}

.entries-counter-pill {
  font-size: 0.78rem;
  font-weight: 600;
  padding: 5px 12px;
  border-radius: 999px;
  background: var(--bg-surface-1);
  border: 1px solid var(--gold-border);
  color: var(--gold-accent);
}

/* ==========================================================================
   TELA INÍCIO — Saudação, Seletor de Período, Herói Editorial e Grade Desktop
   ========================================================================== */

.home-editorial-topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-3);
  flex-wrap: wrap;
  padding-bottom: var(--space-2);
  border-bottom: 1px solid var(--border-subtle);
}

.greeting-block {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.greeting-kicker {
  font-size: 0.7rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.14em;
  color: var(--gold-accent);
}

.greeting-title {
  font-family: var(--font-serif);
  font-size: clamp(1.35rem, 2.5vw, 1.7rem);
  font-weight: 700;
  margin: 0;
  color: var(--text-primary);
}

.month-navigator {
  display: inline-flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-2);
  background: var(--bg-surface-1);
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-md);
  padding: 4px 6px;
}

.month-navigator-label {
  font-family: var(--font-serif);
  font-size: 1rem;
  font-weight: 600;
  color: var(--text-primary);
  padding: 0 var(--space-2);
  min-width: 148px;
  text-align: center;
}

/* Grade Principal da Tela Início (Empilhada no Mobile, 2 Colunas Assimétricas no Desktop) */
.home-editorial-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: var(--space-5);
  align-items: start;
}

@media (min-width: 1024px) {
  .home-editorial-grid {
    grid-template-columns: 1.15fr 0.85fr;
    gap: var(--space-6);
  }
}

.home-col-primary,
.home-col-secondary {
  display: flex;
  flex-direction: column;
  gap: var(--space-5);
  min-width: 0;
}

/* Cartão Principal de Saldo Disponível */
.free-balance-hero {
  background: var(--hero-surface);
  border: 1px solid var(--gold-border);
  border-radius: var(--radius-lg);
  padding: var(--space-5);
  box-shadow: var(--shadow-card);
  display: flex;
  flex-direction: column;
  gap: var(--space-4);
  position: relative;
}

.free-balance-hero.is-negative-hero {
  background: var(--hero-negative-surface);
  border-color: var(--color-expense);
}

.hero-kicker {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-2);
  font-size: 0.72rem;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--gold-accent);
}

.hero-days-pill {
  background: var(--bg-surface-2);
  border: 1px solid var(--border-subtle);
  color: var(--text-secondary);
  padding: 4px 10px;
  border-radius: 999px;
  font-weight: 600;
  letter-spacing: 0.02em;
  text-transform: none;
}

.hero-main-amount {
  font-family: var(--font-serif);
  font-size: clamp(2.55rem, 6vw, 3.35rem);
  font-weight: 700;
  color: var(--color-income);
  line-height: 1.06;
  letter-spacing: -0.02em;
}

.hero-main-amount.is-negative {
  color: var(--color-expense);
}

.hero-per-day-unit {
  font-family: var(--font-sans);
  font-size: 0.95rem;
  font-weight: 500;
  color: var(--text-secondary);
  margin-left: 4px;
}

.hero-explanation {
  margin: 0;
  font-size: 0.88rem;
  color: var(--text-secondary);
  line-height: 1.48;
}

/* Indicador de Ritmo Financeiro Mensal + Gráfico de 7 Dias */
.hero-insights-row {
  display: grid;
  grid-template-columns: 1fr 1.15fr;
  gap: var(--space-3);
  padding: var(--space-3) var(--space-4);
  background: var(--bg-surface-2);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  align-items: center;
}

@media (max-width: 480px) {
  .hero-insights-row {
    grid-template-columns: 1fr;
  }
}

.hero-pace-widget {
  display: flex;
  align-items: center;
  gap: var(--space-3);
}

.pace-ring-svg {
  flex-shrink: 0;
}

.pace-ring-progress {
  animation: scaleRingIn var(--dur-slow) var(--ease-out);
}

@keyframes scaleRingIn {
  from { opacity: 0; transform: rotate(-90deg) scale(0.92); transform-origin: 30px 30px; }
  to { opacity: 1; transform: rotate(-90deg) scale(1); transform-origin: 30px 30px; }
}

.pace-ring-text {
  fill: var(--text-primary);
  font-family: var(--font-sans);
  font-size: 11px;
  font-weight: 700;
}

.pace-meta {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.pace-title,
.mini-7d-label {
  font-size: 0.7rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--gold-accent);
}

.pace-sub {
  font-size: 0.76rem;
  color: var(--text-secondary);
}

.hero-mini-7d {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.mini-7d-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
}

.mini-7d-touch-val {
  font-size: 0.74rem;
  font-weight: 600;
  color: var(--gold-accent);
  white-space: nowrap;
}

.mini-7d-bars {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 3px;
  height: 52px;
  align-items: end;
}

.mini-bar-col {
  min-height: 48px;
  padding: 2px 0;
  border: none;
  background: transparent;
  color: inherit;
  font-family: inherit;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-end;
  gap: 3px;
  height: 100%;
  cursor: pointer;
  border-radius: 6px;
  transition: transform var(--dur-fast) var(--ease-out), opacity var(--dur-fast) ease;
}

.mini-bar-col:active,
.mini-bar-col.is-selected {
  transform: scale(0.95);
}

.mini-bar-col.is-selected .mini-bar-day {
  color: var(--gold-accent);
  font-weight: 700;
}

.mini-bar-track {
  flex: 1;
  width: 100%;
  max-width: 11px;
  background: var(--border-subtle);
  border-radius: 999px;
  display: flex;
  align-items: flex-end;
  overflow: hidden;
}

.mini-bar-fill {
  width: 100%;
  border-radius: 999px;
  transform-origin: bottom;
  animation: barGrowUp var(--dur-slow) var(--ease-out) both;
}

@keyframes barGrowUp {
  from { transform: scaleY(0.1); opacity: 0; }
  to { transform: scaleY(1); opacity: 1; }
}

.mini-bar-fill.is-exp { background: var(--color-expense); }
.mini-bar-fill.is-inc { background: var(--color-income); }
.mini-bar-fill.is-idle { background: var(--text-muted); opacity: 0.35; }

.mini-bar-day {
  font-size: 0.64rem;
  color: var(--text-muted);
}

/* Indicadores Financeiros Mensais (Entradas | Saídas | Resultado) */
.hero-summary-strip {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: var(--space-3);
  padding-top: var(--space-3);
  border-top: 1px solid var(--border-subtle);
}

.strip-col {
  display: flex;
  flex-direction: column;
  gap: 3px;
  min-width: 0;
}

.strip-label {
  font-size: 0.68rem;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text-muted);
}

.strip-val {
  font-family: var(--font-serif);
  font-size: clamp(0.92rem, 2vw, 1.12rem);
  font-weight: 700;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.is-income { color: var(--color-income); }
.is-expense { color: var(--color-expense); }
.is-transfer { color: var(--color-transfer); }

/* Seções e Cartões de Contas */
.ledger-section {
  display: flex;
  flex-direction: column;
  gap: var(--space-3);
}

.section-ruled {
  padding-top: var(--space-4);
  border-top: 1px solid var(--border-subtle);
}

.section-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-2);
  flex-wrap: wrap;
}

.section-kicker-title {
  font-family: var(--font-sans);
  font-size: 0.72rem;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--gold-accent);
  margin: 0;
}

.section-title {
  font-family: var(--font-serif);
  font-size: 1.18rem;
  font-weight: 600;
  margin: 0;
}

.section-subtitle {
  margin: 2px 0 0;
  font-size: 0.84rem;
  color: var(--text-secondary);
}

.section-meta {
  font-size: 0.82rem;
  color: var(--text-secondary);
}

/* Carrossel no Mobile / Grade Adaptável no Tablet & Desktop */
.accounts-carousel {
  display: flex;
  gap: var(--space-3);
  overflow-x: auto;
  scroll-snap-type: x mandatory;
  padding: 2px 2px 6px;
  scrollbar-width: none;
}

.accounts-carousel::-webkit-scrollbar {
  display: none;
}

.account-carousel-card {
  scroll-snap-align: start;
  flex: 0 0 172px;
  min-height: 102px;
  background: var(--bg-surface-1);
  border: 1px solid var(--border-subtle);
  border-left: 3px solid var(--acc-accent, var(--gold-accent));
  border-radius: var(--radius-md);
  padding: var(--space-3) var(--space-4);
  text-align: left;
  color: var(--text-primary);
  font-family: var(--font-sans);
  cursor: pointer;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  box-shadow: var(--shadow-sm);
  transition: transform var(--dur-fast) var(--ease-out), border-color var(--dur-fast) ease, background-color var(--dur-fast) ease;
}

.account-carousel-card:hover {
  background: var(--bg-surface-2);
  border-color: var(--gold-border);
}

.account-carousel-card:active {
  transform: scale(0.98);
}

@media (min-width: 768px) {
  .accounts-carousel {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(175px, 1fr));
    overflow-x: visible;
  }
  .account-carousel-card {
    flex: initial;
  }
}

.account-card-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.account-icon-badge {
  width: 32px;
  height: 32px;
  border-radius: 8px;
  background: var(--bg-surface-2);
  display: inline-flex;
  align-items: center;
  justify-content: center;
}

.account-type-tag {
  font-size: 0.66rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--text-muted);
}

.account-name {
  font-size: 0.88rem;
  font-weight: 600;
  margin-top: var(--space-2);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.account-balance {
  font-family: var(--font-serif);
  font-size: 1.06rem;
  font-weight: 700;
  margin-top: 2px;
}

/* Próximos Vencimentos */
.upcoming-clean-list {
  background: var(--bg-surface-1);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  padding: 0 var(--space-4);
  box-shadow: var(--shadow-sm);
}

.upcoming-clean-row {
  padding: var(--space-3) 0;
  border-bottom: 1px solid var(--ruled-line);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-3);
}

.upcoming-clean-row:last-child {
  border-bottom: none;
}

.upcoming-info {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  min-width: 0;
  flex: 1;
}

.upcoming-info > div {
  min-width: 0;
  flex: 1;
}

.due-days-chip {
  font-size: 0.72rem;
  font-weight: 700;
  padding: 4px 9px;
  border-radius: 999px;
  white-space: nowrap;
  flex-shrink: 0;
}

.due-days-chip.is-upcoming {
  background: var(--bg-surface-2);
  color: var(--text-secondary);
}

.due-days-chip.is-soon,
.due-days-chip.is-today {
  background: var(--gold-accent-soft);
  color: var(--gold-accent);
  border: 1px solid var(--gold-border);
}

.due-days-chip.is-overdue {
  background: var(--color-expense-bg);
  color: var(--color-expense);
}

.upcoming-desc {
  font-weight: 600;
  font-size: 0.92rem;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.upcoming-sub {
  font-size: 0.8rem;
  color: var(--text-secondary);
}

.btn-confirm-bill {
  background: var(--color-income-bg);
  color: var(--color-income);
  border: 1px solid rgba(131, 171, 139, 0.35);
  flex-shrink: 0;
}

/* ==========================================================================
   FOLHA PAUTADA DO LIVRO-RAZÃO E HISTÓRICO (Zero Corte em 360px)
   ========================================================================== */

.ledger-sheet {
  background-color: var(--bg-surface-1);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  overflow: hidden;
  box-shadow: var(--shadow-sm);
}

.ledger-row {
  display: grid;
  grid-template-columns: 50px minmax(0, 1fr);
  align-items: stretch;
  border-bottom: 1px solid var(--ruled-line);
  min-height: 62px;
  animation: rowStaggerIn var(--dur-normal) var(--ease-out) both;
  animation-delay: var(--stagger-delay, 0ms);
}

@keyframes rowStaggerIn {
  from {
    opacity: 0;
    transform: translateY(6px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.ledger-row:last-child {
  border-bottom: none;
}

.ledger-margin {
  border-right: 1.5px solid var(--margin-line);
  padding: 6px 2px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: rgba(0, 0, 0, 0.04);
  user-select: none;
}

.margin-day {
  font-family: var(--font-serif);
  font-size: 0.94rem;
  font-weight: 700;
  line-height: 1.1;
  color: var(--text-primary);
}

.margin-month {
  font-size: 0.62rem;
  font-weight: 700;
  letter-spacing: 0.08em;
  color: var(--gold-accent);
}

.margin-ditto {
  color: var(--text-muted);
  font-size: 0.82rem;
}

.ledger-row-main {
  background: transparent;
  border: none;
  color: inherit;
  font-family: inherit;
  text-align: left;
  padding: 10px 14px;
  display: flex;
  align-items: center;
  gap: 12px;
  cursor: pointer;
  min-height: 60px;
  width: 100%;
  min-width: 0;
  transition: background-color var(--dur-fast) ease;
}

.ledger-row-main:hover {
  background: var(--bg-surface-2);
}

.ledger-row-main:active {
  background: var(--bg-surface-3);
}

.ledger-cat-circle {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  background: color-mix(in srgb, var(--circle-color, #B99B69) 18%, transparent);
  color: var(--circle-color, var(--text-primary));
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.ledger-row-body {
  min-width: 0;
  flex: 1 1 auto;
}

.ledger-row-title-line {
  display: flex;
  align-items: center;
  gap: 6px;
  min-width: 0;
}

.ledger-desc {
  font-weight: 600;
  font-size: 0.93rem;
  color: var(--text-primary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.ledger-edited-badge {
  font-size: 0.65rem;
  padding: 1px 6px;
  border-radius: 4px;
  background: var(--bg-surface-3);
  color: var(--gold-accent);
  flex-shrink: 0;
}

.ledger-row-meta {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: nowrap;
  margin-top: 2px;
  font-size: 0.77rem;
  color: var(--text-secondary);
  min-width: 0;
}

.ledger-sub {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.ledger-tags {
  display: inline-flex;
  gap: 4px;
  flex-shrink: 0;
}

.ledger-tag {
  font-size: 0.68rem;
  color: var(--gold-accent);
  background: var(--gold-accent-soft);
  padding: 0 6px;
  border-radius: 4px;
}

.ledger-row-amount {
  font-family: var(--font-serif);
  font-weight: 700;
  font-size: 0.98rem;
  white-space: nowrap;
  flex-shrink: 0;
  text-align: right;
  margin-left: 6px;
}

/* Barra de Busca e Filtros do Histórico */
.history-search-toolbar {
  display: flex;
  gap: var(--space-2);
  align-items: center;
}

.search-field-wrapper {
  position: relative;
  flex: 1;
  min-width: 0;
}

.search-field-icon {
  position: absolute;
  left: 14px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-muted);
  pointer-events: none;
  display: flex;
}

.search-with-icon {
  padding-left: 40px !important;
}

.filter-trigger-btn {
  flex-shrink: 0;
  position: relative;
}

.filter-trigger-btn.has-active-filters {
  border-color: var(--gold-accent);
  color: var(--gold-accent);
}

.filter-count-badge {
  background: var(--gold-accent);
  color: var(--accent-contrast);
  font-size: 0.72rem;
  font-weight: 700;
  min-width: 20px;
  height: 20px;
  padding: 0 6px;
  border-radius: 999px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}

.active-filter-chips {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-2);
  align-items: center;
}

.removable-filter-chip {
  min-height: 44px;
  padding: 0 12px;
  border-radius: 999px;
  border: 1px solid var(--gold-border);
  background: var(--bg-surface-2);
  color: var(--text-primary);
  font-family: var(--font-sans);
  font-size: 0.8rem;
  font-weight: 600;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  cursor: pointer;
}

.clear-all-filters-link {
  min-height: 44px;
  padding: 0 10px;
  background: none;
  border: none;
  color: var(--color-expense);
  font-size: 0.82rem;
  font-weight: 600;
  cursor: pointer;
}

.ledger-day-group {
  margin-bottom: var(--space-4);
}

.ledger-day-header.is-sticky-day {
  position: sticky;
  top: 68px;
  z-index: 10;
  background-color: var(--bg-surface-2);
  padding: 8px 12px;
  border-radius: var(--radius-sm);
  margin-bottom: 6px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 0.76rem;
  border: 1px solid var(--border-subtle);
}

.day-header-date {
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--gold-accent);
}

.day-header-net {
  font-weight: 700;
}

/* Estados Vazios */
.empty-ledger-card {
  background: var(--bg-surface-1);
  border: 1px dashed var(--gold-border);
  border-radius: var(--radius-md);
  padding: var(--space-6) var(--space-4);
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--space-3);
}

.empty-ledger-title {
  font-family: var(--font-serif);
  font-size: 1.16rem;
  margin: 0;
}

.empty-ledger-desc {
  margin: 0;
  max-width: 400px;
  font-size: 0.88rem;
  color: var(--text-secondary);
}

.subtle-empty-box {
  background: var(--bg-surface-1);
  border: 1px dashed var(--border-strong);
  border-radius: var(--radius-md);
  padding: var(--space-3) var(--space-4);
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: var(--space-2);
  font-size: 0.86rem;
  color: var(--text-secondary);
}

/* Formulários e Campos */
.inline-creation-form {
  background: var(--bg-surface-1);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  padding: var(--space-4);
  display: flex;
  flex-direction: column;
  gap: var(--space-3);
}

.inline-creation-form.is-flat {
  background: transparent;
  border: none;
  padding: 4px 0 0;
  width: 100%;
}

.form-mini-title {
  font-family: var(--font-serif);
  font-size: 1.04rem;
  margin: 0;
  color: var(--gold-accent);
}

.filters-grid,
.form-row-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: var(--space-3);
  align-items: end;
}

.filters-custom-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: var(--space-3);
}

.filter-field,
.sheet-field {
  display: flex;
  flex-direction: column;
  gap: 5px;
}

.filter-label,
.field-kicker {
  font-size: 0.7rem;
  font-weight: 700;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  color: var(--text-secondary);
}

.ledger-input,
.ledger-select,
.ledger-textarea {
  min-height: 44px;
  width: 100%;
  padding: 8px 12px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-strong);
  background: var(--bg-surface-2);
  color: var(--text-primary);
  font-family: var(--font-sans);
  font-size: 0.92rem;
  transition: border-color var(--dur-fast) ease;
}

.ledger-input:focus,
.ledger-select:focus,
.ledger-textarea:focus {
  border-color: var(--gold-accent);
}

.ledger-textarea {
  min-height: 68px;
  resize: vertical;
}

.ledger-color-input {
  min-height: 44px;
  width: 100%;
  padding: 4px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-strong);
  background: var(--bg-surface-2);
  cursor: pointer;
}

/* ==========================================================================
   PLANEJAMENTO — Envelopes, Fixas e Metas em Grade Responsiva
   ========================================================================== */

.envelopes-list,
.goals-list {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: var(--space-3);
}

.recurrences-list {
  display: flex;
  flex-direction: column;
  gap: var(--space-3);
}

.envelope-card,
.goal-card,
.recurrence-row {
  background: var(--bg-surface-1);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  padding: var(--space-4);
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
  box-shadow: var(--shadow-sm);
}

.recurrence-row {
  flex-direction: row;
  align-items: center;
  justify-content: space-between;
}

.recurrence-main {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  min-width: 0;
}

.recurrence-actions {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-shrink: 0;
}

.upcoming-date {
  font-family: var(--font-serif);
  font-weight: 700;
  font-size: 0.86rem;
  padding: 6px 10px;
  background: var(--bg-surface-2);
  border: 1px solid var(--gold-border);
  color: var(--gold-accent);
  border-radius: var(--radius-sm);
}

.confirmed-pill {
  font-size: 0.78rem;
  font-weight: 600;
  color: var(--color-income);
  display: inline-flex;
  align-items: center;
  gap: 4px;
}

.freq-tag {
  font-size: 0.68rem;
  padding: 2px 6px;
  border-radius: 4px;
  background: var(--bg-surface-3);
  color: var(--text-secondary);
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

.envelope-card.is-warning {
  border-color: var(--gold-accent);
}

.envelope-card.is-danger {
  border-color: var(--color-expense);
}

.envelope-card-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-2);
}

.envelope-title-wrap {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  flex-wrap: wrap;
}

.envelope-badge,
.goal-forecast-pill {
  font-size: 0.72rem;
  font-weight: 600;
  padding: 2px 8px;
  border-radius: 999px;
  background: var(--bg-surface-2);
  color: var(--text-secondary);
}

.envelope-badge.is-warning {
  background: var(--gold-accent-soft);
  color: var(--gold-accent);
}

.envelope-badge.is-danger {
  background: var(--color-expense-bg);
  color: var(--color-expense);
}

.envelope-progress-track {
  height: 10px;
  background: var(--bg-surface-3);
  border-radius: 999px;
  overflow: hidden;
}

.envelope-progress-fill {
  height: 100%;
  border-radius: 999px;
  transform-origin: left;
  animation: progressFillIn var(--dur-slow) var(--ease-out);
}

@keyframes progressFillIn {
  from { transform: scaleX(0); }
  to { transform: scaleX(1); }
}

.envelope-progress-fill.is-ok { background: var(--color-income); }
.envelope-progress-fill.is-warning { background: var(--gold-accent); }
.envelope-progress-fill.is-danger { background: var(--color-expense); }

.envelope-card-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: var(--space-2);
  font-size: 0.8rem;
  color: var(--text-secondary);
}

/* ==========================================================================
   ANÁLISES — Indicadores e Gráficos Lado a Lado em Telas Grandes
   ========================================================================== */

.analytics-kpi-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: var(--space-3);
}

.analytics-kpi-grid .kpi-box-full {
  grid-column: 1 / -1;
  flex-direction: row;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: var(--space-2);
  border-color: var(--gold-border);
}

.kpi-box {
  background: var(--bg-surface-1);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  padding: var(--space-4);
  display: flex;
  flex-direction: column;
  gap: 4px;
  box-shadow: var(--shadow-sm);
}

.kpi-label {
  font-size: 0.7rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--gold-accent);
}

.kpi-val {
  font-family: var(--font-serif);
  font-size: clamp(1.2rem, 2.5vw, 1.5rem);
  font-weight: 700;
}

.kpi-sub {
  font-size: 0.76rem;
  color: var(--text-secondary);
}

.analytics-charts-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: var(--space-4);
}

@media (min-width: 1024px) {
  .analytics-charts-grid {
    grid-template-columns: 1fr 1fr;
  }
  .analytics-charts-grid .chart-card-wide {
    grid-column: 1 / -1;
  }
}

.chart-card {
  background: var(--bg-surface-1);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  padding: var(--space-4);
  box-shadow: var(--shadow-sm);
}

.chart-inline-hint {
  font-size: 0.78rem;
  color: var(--text-secondary);
  margin: -2px 0 6px;
  min-height: 24px;
  display: flex;
  align-items: center;
}

.tooltip-active-content {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  color: var(--text-primary);
}

.tooltip-val {
  font-family: var(--font-serif);
  font-weight: 700;
  color: var(--gold-accent);
}

.donut-layout {
  display: grid;
  grid-template-columns: 1fr;
  gap: var(--space-4);
  justify-items: center;
}

.donut-svg {
  width: 100%;
  max-width: 205px;
  height: auto;
  animation: scaleDonutIn var(--dur-slow) var(--ease-out);
}

@keyframes scaleDonutIn {
  from { opacity: 0; transform: scale(0.92); }
  to { opacity: 1; transform: scale(1); }
}

.donut-slice-arc {
  transition: opacity 0.2s ease, transform 0.2s var(--ease-out);
  transform-origin: 110px 110px;
}

.donut-slice-arc.is-highlighted {
  transform: scale(1.045);
}

.svg-center-caption {
  fill: var(--gold-accent);
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.12em;
}

.svg-center-total {
  fill: var(--text-primary);
  font-family: var(--font-serif);
  font-size: 13.5px;
  font-weight: 700;
}

.donut-legend {
  list-style: none;
  margin: 0;
  padding: 0;
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.donut-legend-item {
  min-height: 44px;
  display: grid;
  grid-template-columns: 12px 1fr auto auto;
  align-items: center;
  gap: 10px;
  padding: 6px 10px;
  border-radius: var(--radius-sm);
  background: var(--bg-surface-2);
  border: 1px solid transparent;
  font-size: 0.85rem;
  cursor: pointer;
  transition: border-color var(--dur-fast) ease, background-color var(--dur-fast) ease;
}

.donut-legend-item.is-highlighted {
  border-color: var(--gold-accent);
  background: var(--bg-surface-3);
}

.legend-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  display: inline-block;
}

.legend-pct {
  color: var(--text-muted);
  font-size: 0.78rem;
}

.legend-val {
  font-weight: 600;
}

.svg-scroll-container {
  width: 100%;
  overflow-x: auto;
}

.bars-svg,
.line-svg {
  width: 100%;
  min-width: 290px;
  height: auto;
  display: block;
}

.svg-grid-line {
  stroke: var(--border-subtle);
  stroke-dasharray: 3 3;
  stroke-width: 1;
}

.svg-zero-line {
  stroke: var(--border-strong);
  stroke-width: 1.2;
}

.svg-bar-income {
  fill: var(--color-income);
  transform-box: fill-box;
  transform-origin: bottom;
  animation: barGrowUp var(--dur-slow) var(--ease-out) both;
}

.svg-bar-expense {
  fill: var(--color-expense);
  transform-box: fill-box;
  transform-origin: bottom;
  animation: barGrowUp var(--dur-slow) var(--ease-out) both;
}

.svg-balance-line {
  stroke: var(--color-income);
  stroke-width: 2.5;
  stroke-linecap: round;
  stroke-linejoin: round;
  animation: fadeChartIn var(--dur-slow) var(--ease-out) both;
}

.svg-balance-area {
  animation: fadeChartIn var(--dur-slow) var(--ease-out) both;
}

@keyframes fadeChartIn {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: translateY(0); }
}

.svg-line-dot {
  fill: var(--bg-surface-1);
  stroke: var(--color-income);
  stroke-width: 2;
}

.svg-axis-label {
  fill: var(--text-muted);
  font-size: 10px;
}

.svg-interactive-shape {
  cursor: pointer;
  transition: opacity var(--dur-fast) ease;
}

.svg-interactive-shape:hover {
  opacity: 0.82;
}

/* ==========================================================================
   AJUSTES — Grupos Editoriais em Grade de 2 Colunas no Desktop
   ========================================================================== */

.settings-editorial-grid {

  gap: var(--space-5);

}

@media (min-width: 1024px) {

.ios-group-section {

.ios-group-header {

.ios-group-card {

.ios-icon-badge {

.ios-icon-badge.is-moss {

.setting-name {

.pin-inline-form {

}

.backup-actions-grid {

}

.import-preview-card,
.confirm-danger-box {

.preview-stats-list {

}

.preview-actions-row {

}

.dev-tools-details {

}

.dev-tools-details:last-child {

}

.dev-tools-summary {

/* Avisos Compactos de Backup e Envelopes */
.backup-reminder-banner {

}

.banner-text {

.banner-actions {

.envelope-alert-item {

.envelope-alert-left {

.amount-live-hint {

/* ==========================================================================
   NAVEGAÇÃO INFERIOR MOBILE (<768px)
   ========================================================================== */

.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  z-index: 30;
  background-color: var(--bg-surface-1);
  border-top: 1px solid var(--border-strong);
  padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px));
  display: grid;
  grid-template-columns: 1fr 1fr 68px 1fr 1fr;
  align-items: center;
  box-shadow: 0 -8px 26px rgba(0, 0, 0, 0.35);
}

.nav-sliding-pill {
  position: absolute;
  top: 0;
  left: 8px;
  width: calc((100% - 16px - 68px) / 4);
  height: 3px;
  background: var(--gold-accent);
  border-radius: 0 0 4px 4px;
  transition: transform var(--dur-normal) var(--ease-out), opacity var(--dur-fast) ease;
  transform: translateX(
    calc(
      var(--active-nav-idx, 0) * 100% +
      max(0, var(--active-nav-idx, 0) - 1) * 68px
    )
  );
}

.bottom-nav.is-settings-active .nav-sliding-pill {
  opacity: 0;
}

.bottom-nav-item {
  min-width: 48px;
  min-height: 48px;
  padding: 4px 2px;
  border: none;
  background: transparent;
  color: var(--text-muted);
  font-family: var(--font-sans);
  font-size: 0.7rem;
  font-weight: 600;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  cursor: pointer;
  border-radius: var(--radius-sm);
  transition: transform var(--dur-fast) var(--ease-out), color var(--dur-fast) ease;
}

.bottom-nav-item:active {
  transform: scale(0.93);
}

.bottom-nav-item.is-active {
  color: var(--color-income);
}

.fab-center-slot {
  display: flex;
  align-items: center;
  justify-content: center;
}

.fab-launch-btn {
  width: 54px;
  height: 54px;
  margin-top: -18px;
  border-radius: 50%;
  border: 3px solid var(--bg-canvas);
  background: var(--accent-primary);
  color: var(--accent-contrast);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  box-shadow: 0 8px 20px rgba(0, 0, 0, 0.45);
  transition: transform var(--dur-fast) var(--ease-out);
}

.fab-launch-btn:active {
  transform: scale(0.91);
}

/* ==========================================================================
   FOLHA INFERIOR / MODAL DE NOVO LANÇAMENTO E FILTROS
   ========================================================================== */

.sheet-backdrop {
  position: fixed;
  inset: 0;
  z-index: 50;
  background: rgba(8, 12, 10, 0.72);
  display: flex;
  align-items: flex-end;
  justify-content: center;
  animation: fadeBackdrop var(--dur-fast) ease;
}

@media (min-width: 768px) {
  .sheet-backdrop {
    align-items: center;
    padding: var(--space-4);
  }
}

@keyframes fadeBackdrop {
  from { opacity: 0; }
  to { opacity: 1; }
}

.bottom-sheet {
  width: 100%;
  max-width: 560px;
  max-height: 92dvh;
  overflow-y: auto;
  background: var(--bg-surface-1);
  border: 1px solid var(--gold-border);
  border-radius: var(--radius-lg) var(--radius-lg) 0 0;
  padding: 8px var(--space-4) calc(24px + env(safe-area-inset-bottom, 0px));
  box-shadow: var(--shadow-sheet);
  animation: slideSheetUp var(--dur-normal) var(--ease-out);
}

@media (min-width: 768px) {
  .bottom-sheet {
    border-radius: var(--radius-lg);
    padding: var(--space-4) var(--space-5) var(--space-5);
  }
}

@keyframes slideSheetUp {
  from { transform: translateY(42px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}

.sheet-drag-zone {
  padding: 6px 0 10px;
  cursor: grab;
}

.sheet-handle {

  height: 4px;
  background: var(--border-strong);
  border-radius: 999px;
  margin: 0 auto;
}

.sheet-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: var(--space-3);
}

.sheet-serif-title {

  font-size: 1.28rem;
  margin: 0;
}

.type-segmented {

  grid-template-columns: repeat(3, 1fr);

}

.seg-btn {

  color: var(--text-secondary);
  font-family: var(--font-sans);
  font-weight: 600;
  font-size: 0.85rem;
  cursor: pointer;

}

.seg-btn:active {

}

.seg-btn.is-active {

.amount-field-box {

.currency-prefix {

.amount-giant-input {

}

.sheet-field-group {

}

.category-chips-scroll {

.cat-chip {

/* ==========================================================================
   NOTIFICAÇÕES ANIMADAS (TOAST) E TELA DE BLOQUEIO POR PIN

#toast-root {

(function() {
"use strict";

// === Module: js/money.js ===
/**
 * RAZÃO — Módulo de Dinheiro (money.js)
 * Regras inegociáveis:
 * - Todo valor monetário no sistema é representado como inteiro em CENTAVOS.
 * - Nenhuma operação de domínio usa ponto flutuante.
 * - Conversão apenas na entrada do usuário e na formatação de exibição.
 */

const brlFormatter = new Intl.NumberFormat('pt-BR', {
  style: 'currency',
  currency: 'BRL',
  minimumFractionDigits: 2,
  maximumFractionDigits: 2
});

const decimalFormatter = new Intl.NumberFormat('pt-BR', {
  minimumFractionDigits: 2,
  maximumFractionDigits: 2
});

/**
 * Verifica se um valor é um inteiro seguro representando centavos.
 * @param {unknown} cents
 * @returns {boolean}
 */
function isValidCents(cents) {
  return typeof cents === 'number' && Number.isSafeInteger(cents);
}

/**
 * B5: Máscara monetária ao digitar (digitar "123456" exibe "1.234,56").
 * Se a string contiver apenas dígitos ou já estiver no padrão de máscara,
 * interpreta os dois últimos dígitos como centavos.
 * @param {string} rawValue
 * @returns {string}
 */
function formatMoneyMask(rawValue) {
  const digits = String(rawValue ?? '').replace(/\D+/g, '');
  if (!digits) return '';
  const cleanDigits = digits.replace(/^0+/, '');
  if (!cleanDigits) return '0,00';
  const padded = cleanDigits.padStart(3, '0');
  const intPart = padded.slice(0, -2);
  const fracPart = padded.slice(-2);
  const formattedInt = intPart.replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  return `${formattedInt},${fracPart}`;
}

/**
 * Item 6: Gera a dica dinâmica abaixo do campo de valor.
 * Quando vazio: "digite só números, os centavos entram sozinhos".
 * Quando preenchido: "= R$ 5.000,00".
 */
function getAmountInputHint(rawValue) {
  const parsed = parseMoneyInput(rawValue);
  if (parsed.ok && parsed.cents > 0) {
    return `= ${formatBRL(parsed.cents)}`;
  }
  return 'digite só números, os centavos entram sozinhos';
}

/**
 * Converte uma entrada digitada pelo usuário ("1.234,56", "1234,56", "1234.56", "R$ 50,00")
 * em centavos inteiros positivos (> 0).
 * Rejeita vazio, zero, negativo, texto inválido ou mais de 2 casas decimais.
 *
 * @param {string|number} rawInput
 * @param {{ allowZero?: boolean, allowNegative?: boolean }} [options]
 * @returns {{ ok: boolean, cents: number, error?: string }}
 */
function parseMoneyInput(rawInput, options = {}) {
  const { allowZero = false, allowNegative = false } = options;

  if (rawInput === null || rawInput === undefined) {
    return { ok: false, cents: 0, error: 'Informe um valor em reais.' };
  }

  let str = String(rawInput).trim();
  if (!str) {
    return { ok: false, cents: 0, error: 'O valor não pode ficar vazio.' };
  }

  // Remove símbolo "R$" e espaços internos nas bordas do símbolo
  str = str.replace(/^R\$\s*/i, '').trim();

  if (!str) {
    return { ok: false, cents: 0, error: 'Informe um valor numérico válido.' };
  }

  // Verifica sinal negativo
  let isNegative = false;
  if (str.startsWith('-')) {
    if (!allowNegative) {
      return { ok: false, cents: 0, error: 'O valor deve ser maior que zero (não use sinal negativo).' };
    }
    isNegative = true;
    str = str.slice(1).trim();
  } else if (str.startsWith('+')) {
    str = str.slice(1).trim();
  }

  // Rejeita qualquer caractere que não seja dígito, ponto ou vírgula
  if (!/^[0-9.,]+$/.test(str) || !/[0-9]/.test(str)) {
    return { ok: false, cents: 0, error: 'Digite apenas números (ex.: 1.234,56 ou 1234,56).' };
  }

  const hasComma = str.includes(',');
  const hasDot = str.includes('.');

  let intPart = '';
  let fracPart = '';

  if (hasComma && hasDot) {
    const lastComma = str.lastIndexOf(',');
    const lastDot = str.lastIndexOf('.');
    if (lastComma > lastDot) {
      const parts = str.split(',');
      if (parts.length > 2) {
        return { ok: false, cents: 0, error: 'Formato inválido: mais de uma vírgula decimal.' };
      }
      const rawInt = parts[0];
      fracPart = parts[1];
      if (!/^\d{1,3}(\.\d{3})+$/.test(rawInt)) {
        return { ok: false, cents: 0, error: 'Separador de milhar inválido. Use o formato 1.234,56.' };
      }
      intPart = rawInt.replace(/\./g, '');
    } else {
      return { ok: false, cents: 0, error: 'Use o formato brasileiro (1.234,56) ou ponto simples (1234.56).' };
    }
  } else if (hasComma) {
    const parts = str.split(',');
    if (parts.length > 2) {
      return { ok: false, cents: 0, error: 'Formato inválido: use apenas uma vírgula para os centavos.' };
    }
    intPart = parts[0] || '0';
    fracPart = parts[1] ?? '';
    if (parts[1] === '') {
      return { ok: false, cents: 0, error: 'Informe os centavos após a vírgula (ex.: 10,00).' };
    }
  } else if (hasDot) {
    const parts = str.split('.');
    if (parts.length === 2) {
      if (parts[1].length <= 2 && parts[1].length >= 1) {
        intPart = parts[0] || '0';
        fracPart = parts[1];
      } else {
        return { ok: false, cents: 0, error: 'Use no máximo 2 casas para os centavos (ex.: 1234.56 ou 1.234,56).' };
      }
    } else {
      return { ok: false, cents: 0, error: 'Ao usar pontos de milhar, informe os centavos com vírgula (ex.: 1.234,56).' };
    }
  } else {
    intPart = str;
    fracPart = '';
  }

  if (!/^\d+$/.test(intPart) || (fracPart !== '' && !/^\d+$/.test(fracPart))) {
    return { ok: false, cents: 0, error: 'Formato numérico inválido.' };
  }

  if (fracPart.length > 2) {
    return { ok: false, cents: 0, error: 'Informe no máximo duas casas decimais para os centavos.' };
  }

  const paddedFrac = fracPart.padEnd(2, '0');
  const cleanInt = intPart.replace(/^0+(?=\d)/, '');
  if (cleanInt.length > 13) {
    return { ok: false, cents: 0, error: 'Valor excede o limite máximo suportado pelo sistema.' };
  }

  const totalCents = BigInt(cleanInt) * 100n + BigInt(paddedFrac);
  if (totalCents > BigInt(Number.MAX_SAFE_INTEGER)) {
    return { ok: false, cents: 0, error: 'Valor muito alto para cálculo seguro.' };
  }

  let finalCents = Number(totalCents);
  if (isNegative) finalCents = -finalCents;

  if (!allowZero && finalCents === 0) {
    return { ok: false, cents: 0, error: 'O valor deve ser maior que R$ 0,00.' };
  }

  if (!allowNegative && finalCents < 0) {
    return { ok: false, cents: 0, error: 'O valor deve ser positivo.' };
  }

  return { ok: true, cents: finalCents };
}

/**
 * Formata um valor em centavos para moeda BRL ("R$ 1.234,56").
 * @param {number} cents
 * @param {{ showSign?: boolean }} [options]
 * @returns {string}
 */

/**
 * Item 1: Calcula sempre as 7 colunas dos últimos 7 dias (hoje e os 6 dias anteriores,
 * cruzando a fronteira de mês/ano se necessário), com altura proporcional ao maior gasto
 * da semana e rótulo da letra do dia da semana (D, S, T, Q, Q, S, S).
 */
const WEEKDAY_LETTERS_PT = ['D', 'S', 'T', 'Q', 'Q', 'S', 'S'];

function buildLast7DaysSeries(entries = [], refTodayISO = todayISO()) {
  const days = [];
  for (let offset = -6; offset <= 0; offset++) {
    const dateISO = addDaysISO(refTodayISO, offset);
    const p = parseISODate(dateISO);
    const localNoon = p ? new Date(p.year, p.month - 1, p.day, 12, 0, 0) : new Date();
    const weekdayLetter = WEEKDAY_LETTERS_PT[localNoon.getDay()];
    days.push({
      date: dateISO,
      dayNum: p ? String(p.day).padStart(2, '0') : '--',
      weekdayLetter,
      expense: 0,
      income: 0
    });
  }

  const dayMap = new Map(days.map((d) => [d.date, d]));
  for (let i = 0; i < entries.length; i++) {
    const e = entries[i];
    if (!e || !dayMap.has(e.data)) continue;
    const slot = dayMap.get(e.data);
    if (e.tipo === 'saida') slot.expense += e.valor;
    else if (e.tipo === 'entrada') slot.income += e.valor;
  }

  const maxExpense = Math.max(0, ...days.map((d) => d.expense));

  return days.map((d, idx) => {
    const hasExpense = d.expense > 0;
    const heightPct = hasExpense && maxExpense > 0
      ? Math.max(18, Math.round((d.expense / maxExpense) * 100))
      : 10; // Dia sem gasto = barra mínima apagada
    return {
      ...d,
      index: idx,
      maxExpense,
      hasExpense,
      heightPct
    };
  });
}

 * @returns {{ ok: boolean, entries?: object[], errors: string[] }}
 */
function buildInstallmentEntries(raw, installmentsCount, context = {}) {
  const count = Number(installmentsCount);
  if (!Number.isInteger(count) || count < 2 || count > 120) {
    return { ok: false, errors: ['O número de parcelas deve ser entre 2 e 120.'] };
  }

  const baseValidation = validateEntryInput(raw, context);
  if (!baseValidation.ok) {
    return { ok: false, errors: baseValidation.errors };
  }

  const baseEntry = baseValidation.entry;
  const parts = splitInstallments(baseEntry.valor, count);
  const groupId = generateId();
  const parsedStart = parseISODate(baseEntry.data);
  const anchorDay = parsedStart ? parsedStart.day : 1;

  const entries = parts.map((partCents, idx) => {
    const dueDate = idx === 0 ? baseEntry.data : addMonthsISO(baseEntry.data, idx, anchorDay);
    return {
      ...baseEntry,
      id: generateId(),
      valor: partCents,
      data: dueDate,
      descricao: `${baseEntry.descricao} (${idx + 1}/${count})`,
      parcelaGrupoId: groupId,
      parcelaNumero: idx + 1,
      parcelaTotal: count
    };
  });

  return { ok: true, entries, errors: [] };
}

/**
 * Calcula o saldo atual de cada conta e o saldo consolidado a partir dos lançamentos.
 * Regra: Transferência debita da conta de origem e credita na conta de destino,
 * e NUNCA conta como receita nem despesa.
 *
 * @param {Array} accounts
 * @param {Array} entries
 * @param {string} [upToDateISO] - Se informado, considera apenas lançamentos com data <= upToDateISO
 * @returns {{ byAccount: Record<string, number>, totalBalance: number }}
 */
function calculateAccountBalances(accounts, entries, upToDateISO = null) {
  const byAccount = {};
  for (let i = 0; i < accounts.length; i++) {
    byAccount[accounts[i].id] = 0;
  }

  for (let i = 0; i < entries.length; i++) {
    const e = entries[i];
    if (!e || !isValidCents(e.valor)) continue;
    if (upToDateISO && e.data > upToDateISO) continue;

    if (e.tipo === 'entrada') {
      byAccount[e.contaId] = (byAccount[e.contaId] || 0) + e.valor;
    } else if (e.tipo === 'saida') {
      byAccount[e.contaId] = (byAccount[e.contaId] || 0) - e.valor;
    } else if (e.tipo === 'transferencia') {
      byAccount[e.contaId] = (byAccount[e.contaId] || 0) - e.valor;
      if (e.contaDestinoId) {
        byAccount[e.contaDestinoId] = (byAccount[e.contaDestinoId] || 0) + e.valor;
      }
    }
  }

  let totalBalance = 0;
  const activeAccountIds = new Set(accounts.filter((a) => !a.arquivada).map((a) => a.id));
  for (const [accId, bal] of Object.entries(byAccount)) {
    if (activeAccountIds.size === 0 || activeAccountIds.has(accId)) {
      totalBalance += bal;
    }
  }

  return { byAccount, totalBalance };
}

/**
 *Verifica se uma categoria está em uso por algum lançamento, envelope ou recorrência.
 * Regra: Categoria em uso não pode ser apagada, apenas arquivada.
 */
function isCategoryInUse(categoryId, { entries = [], envelopes = [], recurrences = [] }) {
  return (
    entries.some((e) => e.categoriaId === categoryId) ||
    envelopes.some((env) => env.categoriaId === categoryId) ||
    recurrences.some((rec) => rec.categoriaId === categoryId)
  );
}

/**
 * Gera as ocorrências previstas de contas fixas/recorrentes para um mês ("AAAA-MM")
 * e identifica quais já foram confirmadas nos lançamentos.
 * Trata corretamente dia 31 em meses curtos e anos bissextos.
 *
 * @param {Array} recurrences
 * @param {Array} entries
 * @param {string} monthKey - "AAAA-MM"
 * @returns {Array<object>}
 */
function getRecurrencesForMonth(recurrences, entries, monthKey) {
  const bounds = getMonthBounds(monthKey);
  const instances = [];

  for (let i = 0; i < recurrences.length; i++) {
    const rec = recurrences[i];
    if (!rec || rec.ativa === false) continue;

    const freq = rec.frequencia || 'mensal'; // 'mensal' | 'semanal' | 'anual'

    if (freq === 'mensal') {
      const dueDate = getClampedDateInMonth(rec.diaVencimento || 1, monthKey);
      const compKey = `${rec.id}_${monthKey}`;
      const confirmedEntry = entries.find(
        (e) =>
          (e.recorrenciaId === rec.id && e.competenciaRecorrencia === compKey) ||
          (e.recorrenciaId === rec.id && getMonthKey(e.data) === monthKey)
      );

      instances.push({
        instanceKey: compKey,
        recorrenciaId: rec.id,
        descricao: rec.descricao,
        tipo: rec.tipo || 'saida',
        valor: rec.valor,
        contaId: rec.contaId,
        categoriaId: rec.categoriaId,
        frequencia: freq,
        dataVencimento: dueDate,
        confirmada: Boolean(confirmedEntry),
        lancamentoId: confirmedEntry ? confirmedEntry.id : null
      });
    } else if (freq === 'anual') {
      const targetMonth = Number(rec.mesVencimento) || 1;
      if (bounds.month === targetMonth) {
        const dueDate = getClampedDateInMonth(rec.diaVencimento || 1, monthKey);
        const compKey = `${rec.id}_${monthKey}`;
        const confirmedEntry = entries.find(
          (e) => e.recorrenciaId === rec.id && (e.competenciaRecorrencia === compKey || getMonthKey(e.data) === monthKey)
        );
        instances.push({
          instanceKey: compKey,
          recorrenciaId: rec.id,
          descricao: rec.descricao,
          tipo: rec.tipo || 'saida',
          valor: rec.valor,
          contaId: rec.contaId,
          categoriaId: rec.categoriaId,
          frequencia: freq,
          dataVencimento: dueDate,
          confirmada: Boolean(confirmedEntry),
          lancamentoId: confirmedEntry ? confirmedEntry.id : null
        });
      }
    } else if (freq === 'semanal') {
      // Gera ocorrências semanais no mês a partir da dataInicial ou dia 1
      let cursor = bounds.start;
      const startDay = Math.max(1, Math.min(7, Number(rec.diaVencimento) || 1));
      cursor = getClampedDateInMonth(startDay, monthKey);
      let weekIdx = 1;
      while (cursor <= bounds.end) {
        const compKey = `${rec.id}_${cursor}`;
        const confirmedEntry = entries.find(
          (e) => e.recorrenciaId === rec.id && (e.competenciaRecorrencia === compKey || e.data === cursor)
        );
        instances.push({
          instanceKey: compKey,
          recorrenciaId: rec.id,
          descricao: `${rec.descricao} (Sem. ${weekIdx})`,
          tipo: rec.tipo || 'saida',
          valor: rec.valor,
          contaId: rec.contaId,
          categoriaId: rec.categoriaId,
          frequencia: freq,
          dataVencimento: cursor,
          confirmada: Boolean(confirmedEntry),
          lancamentoId: confirmedEntry ? confirmedEntry.id : null
        });
        cursor = addDaysISO(cursor, 7);
        weekIdx++;
      }
    }
  }

  return instances.sort((a, b) => a.dataVencimento.localeCompare(b.dataVencimento));
}

/**
 * Calcula o status dos Envelopes (orçamentos mensais por categoria) para um determinado mês.
 * Avisa em >= 80% ('warning') e >= 100% ('danger').
 *
 * @param {Array} envelopes
 * @param {Array} entries
 * @param {Array} categories
 * @param {string} monthKey - "AAAA-MM"
 */
function calculateEnvelopesStatus(envelopes, entries, categories, monthKey) {
  const catMap = new Map(categories.map((c) => [c.id, c]));
  const spentByCategory = {};

  for (let i = 0; i < entries.length; i++) {
    const e = entries[i];
    if (e.tipo !== 'saida') continue;
    if (getMonthKey(e.data) !== monthKey) continue;
    spentByCategory[e.categoriaId] = (spentByCategory[e.categoriaId] || 0) + e.valor;
  }

  return envelopes
    .filter((env) => env && env.limiteMensal > 0)
    .map((env) => {
      const cat = catMap.get(env.categoriaId) || { nome: 'Categoria', cor: '#8F684D', icone: 'tag' };
      const gasto = spentByCategory[env.categoriaId] || 0;
      const limite = env.limiteMensal;
      const restante = Math.max(0, limite - gasto);
      const excesso = Math.max(0, gasto - limite);
      const percentual = limite > 0 ? Math.round((gasto / limite) * 100) : 0;

      let nivelAlerta = 'ok';
      if (gasto >= limite) {
        nivelAlerta = 'danger'; // >= 100%
      } else if (gasto * 100 >= limite * 80) {
        nivelAlerta = 'warning'; // >= 80%
      }

      return {
        id: env.id,
        categoriaId: env.categoriaId,
        categoriaNome: cat.nome,
        categoriaCor: cat.cor,
        limite,
        gasto,
        restante,
        excesso,
        percentual,
        nivelAlerta
      };
    })
    .sort((a, b) => b.percentual - a.percentual);
}

/**
 * Calcula o "Saldo Livre" do mês e quanto o usuário pode gastar por dia até o fim do mês.
 * Lógica transparente e contábil:
 * - Parte do saldo disponível nas contas (ou resultado disponível)
 * - Desconta contas fixas de saída que ainda vão vencer no mês e não foram pagas
 * - Desconta a reserva ainda não consumida dos envelopes planejados (sem duplicar categoria de conta fixa)
 * - Divide pelos dias restantes até o fim do mês.
 *
 * @param {{
 *   accounts: Array,
 *   entries: Array,
 *   envelopes: Array,
 *   recurrences: Array,
 *   categories: Array,
 *   monthKey?: string,
 *   refTodayISO?: string
 * }} params
 */
function calculateFreeBalance({
  accounts = [],
  entries = [],
  envelopes = [],
  recurrences = [],
  categories = [],
  monthKey = getMonthKey(todayISO()),
  refTodayISO = todayISO()
}) {
  const bounds = getMonthBounds(monthKey);
  const { totalBalance } = calculateAccountBalances(accounts, entries, bounds.end);

  const monthRecurrences = getRecurrencesForMonth(recurrences, entries, monthKey);
  const pendingBills = monthRecurrences.filter((r) => !r.confirmada && r.tipo === 'saida');
  const pendingIncome = monthRecurrences.filter((r) => !r.confirmada && r.tipo === 'entrada');

  const pendingBillsCents = pendingBills.reduce((acc, item) => acc + item.valor, 0);
  const pendingIncomeCents = pendingIncome.reduce((acc, item) => acc + item.valor, 0);

  // Envelopes restantes (descontando o que já é conta fixa pendente da mesma categoria para não abater duas vezes)
  const envStatuses = calculateEnvelopesStatus(envelopes, entries, categories, monthKey);
  let reservedEnvelopesCents = 0;
  for (let i = 0; i < envStatuses.length; i++) {
    const env = envStatuses[i];
    const pendingInCat = pendingBills
      .filter((b) => b.categoriaId === env.categoriaId)
      .reduce((acc, b) => acc + b.valor, 0);
    const uncommittedEnvelope = Math.max(0, env.restante - pendingInCat);
    reservedEnvelopesCents += uncommittedEnvelope;
  }

  // Saldo livre total para gastar sem comprometer contas fixas nem estourar reserva planejada
  // Nota: também calculamos o livre antes da reserva de envelopes caso os envelopes sejam o próprio orçamento de gasto diário
  const freeAfterFixedBills = totalBalance + pendingIncomeCents - pendingBillsCents;
  const freeStrict = freeAfterFixedBills - reservedEnvelopesCents;

  // Se o usuário configurou envelopes, o saldo livre para despesas gerais + envelopes disponíveis é apresentado com clareza
  const effectiveFreeCents = freeAfterFixedBills;
  const remainingDays = getRemainingDaysInMonth(monthKey, refTodayISO);
  const perDayCents = remainingDays > 0 ? Math.trunc(effectiveFreeCents / remainingDays) : effectiveFreeCents;

  return {
    monthKey,
    totalBalanceCents: totalBalance,
    pendingBillsCents,
    pendingIncomeCents,
    reservedEnvelopesCents,
    freeBalanceCents: effectiveFreeCents,
    unallocatedBalanceCents: freeStrict,
    remainingDays,
    perDayCents,
    pendingBillsCount: pendingBills.length
  };
}

/**
 * Calcula o resumo mensal completo: entradas, saídas, resultado, comparação com mês anterior,
 * top categorias, gastos diários e evolução diária do saldo.
 */
function calculateMonthlySummary({
  accounts = [],
  entries = [],
  categories = [],
  monthKey = getMonthKey(todayISO())
}) {
  const bounds = getMonthBounds(monthKey);
  const prevMonthKey = shiftMonthKey(monthKey, -1);
  const catMap = new Map(categories.map((c) => [c.id, c]));

  let entradas = 0;
  let saidas = 0;
  let prevEntradas = 0;
  let prevSaidas = 0;

  const byCategory = {};
  const dailyIncome = new Array(bounds.totalDays).fill(0);
  const dailyExpense = new Array(bounds.totalDays).fill(0);
  const dailyNet = new Array(bounds.totalDays).fill(0);

  // Saldo acumulado antes do início do mês
  const dayBeforeStart = addDaysISO(bounds.start, -1);
  const { totalBalance: openingBalance } = calculateAccountBalances(accounts, entries, dayBeforeStart);

  for (let i = 0; i < entries.length; i++) {
    const e = entries[i];
    if (!e || e.tipo === 'transferencia') continue; // Transferência não é receita nem despesa
    const mKey = getMonthKey(e.data);

    if (mKey === monthKey) {
      const p = parseISODate(e.data);
      const dayIndex = p ? p.day - 1 : 0;

      if (e.tipo === 'entrada') {
        entradas += e.valor;
        dailyIncome[dayIndex] += e.valor;
        dailyNet[dayIndex] += e.valor;
      } else if (e.tipo === 'saida') {
        saidas += e.valor;
        dailyExpense[dayIndex] += e.valor;
        dailyNet[dayIndex] -= e.valor;
        byCategory[e.categoriaId] = (byCategory[e.categoriaId] || 0) + e.valor;
      }
    } else if (mKey === prevMonthKey) {
      if (e.tipo === 'entrada') prevEntradas += e.valor;
      else if (e.tipo === 'saida') prevSaidas += e.valor;
    }
  }

  const resultado = entradas - saidas;
  const prevResultado = prevEntradas - prevSaidas;

  let expenseChangePct = null;
  if (prevSaidas > 0) {
    expenseChangePct = Math.round(((saidas - prevSaidas) / prevSaidas) * 100);
  }

  const topCategories = Object.entries(byCategory)
    .map(([catId, valor]) => {
      const cat = catMap.get(catId) || { id: catId, nome: 'Outros', cor: '#78756E', icone: 'tag' };
      return {
        categoriaId: catId,
        nome: cat.nome,
        cor: cat.cor,
        icone: cat.icone,
        valor,
        percentual: saidas > 0 ? Math.round((valor / saidas) * 100) : 0
      };
    })
    .sort((a, b) => b.valor - a.valor);

  const dailyCumulativeBalance = new Array(bounds.totalDays);
  let running = openingBalance;
  for (let d = 0; d < bounds.totalDays; d++) {
    running += dailyNet[d];
    dailyCumulativeBalance[d] = {
      day: d + 1,
      date: `${monthKey}-${String(d + 1).padStart(2, '0')}`,
      income: dailyIncome[d],
      expense: dailyExpense[d],
      balance: running
    };
  }

  return {
    monthKey,
    entradas,
    saidas,
    resultado,
    prevEntradas,
    prevSaidas,
    prevResultado,
    expenseChangePct,
    topCategories,
    dailySeries: dailyCumulativeBalance,
    openingBalance
  };
}

/**
 * Calcula o progresso e a previsão de conclusão de uma Meta de Economia.
 * @param {object} goal
 * @param {string} [refTodayISO]
 */
function evaluateSavingsGoal(goal, refTodayISO = todayISO()) {
  const alvo = Math.max(1, Number(goal.valorAlvo) || 0);
  const atual = Math.max(0, Number(goal.valorAtual) || 0);
  const aporteMensal = Math.max(0, Number(goal.aporteMensal) || 0);
  const restante = Math.max(0, alvo - atual);
  const percentual = Math.min(100, Math.round((atual / alvo) * 100));

  let mesesRestantes = null;
  let dataPrevisaoISO = null;

  if (restante === 0) {
    mesesRestantes = 0;
    dataPrevisaoISO = refTodayISO;
  } else if (aporteMensal > 0) {
    mesesRestantes = Math.ceil(restante / aporteMensal);
    dataPrevisaoISO = addMonthsISO(refTodayISO, mesesRestantes);
  }

  return {
    ...goal,
    valorAlvo: alvo,
    valorAtual: atual,
    aporteMensal,
    restante,
    percentual,
    mesesRestantes,
    dataPrevisaoISO
  };
}

/**
 * Hash de PIN de 4 a 6 dígitos usando SHA-256 + salt via Web Crypto API.
 * @param {string} pin
 * @param {string} [existingSalt]
 * @returns {Promise<{ hash: string, salt: string }>}
 */
async function hashPin(pin, existingSalt = null) {
  const cleanPin = String(pin || '').trim();
  if (!/^\d{4,6}$/.test(cleanPin)) {
    throw new Error('O PIN deve conter de 4 a 6 dígitos numéricos.');
  }

  let salt = existingSalt;
  if (!salt) {
    const randomBytes = new Uint8Array(16);
    if (typeof crypto !== 'undefined' && crypto.getRandomValues) {
      crypto.getRandomValues(randomBytes);
    } else {
      for (let i = 0; i < 16; i++) randomBytes[i] = Math.floor(Math.random() * 256);
    }
    salt = Array.from(randomBytes, (b) => b.toString(16).padStart(2, '0')).join('');
  }

  const payload = `${salt}:${cleanPin}:razao-v2`;
  if (typeof crypto !== 'undefined' && crypto.subtle && crypto.subtle.digest) {
    const encoder = new TextEncoder();
    const data = encoder.encode(payload);
    const hashBuffer = await crypto.subtle.digest('SHA-256', data);
    const hashArray = Array.from(new Uint8Array(hashBuffer));
    const hashHex = hashArray.map((b) => b.toString(16).padStart(2, '0')).join('');
    return { hash: hashHex, salt };
  }

  // Fallback determinístico caso Web Crypto não esteja disponível em contexto inseguro
  let h1 = 0xdeadbeef ^ payload.length;
  let h2 = 0x41c6ce57 ^ payload.length;
  for (let i = 0, ch; i < payload.length; i++) {
    ch = payload.charCodeAt(i);
    h1 = Math.imul(h1 ^ ch, 2654435761);
    h2 = Math.imul(h2 ^ ch, 1597334677);
  }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  const fallbackHex = (h2 >>> 0).toString(16).padStart(8, '0') + (h1 >>> 0).toString(16).padStart(8, '0');
  return { hash: fallbackHex.repeat(4), salt };
}

 * Gerador de Dados Fictícios ("Teste de Fogo"):

   * Exclui um lançamento com suporte obrigatório a "Desfazer" por 6 segundos.
   */
  async deleteEntry(entryId) {
    return this.withLock(`delete_${entryId}`, async () => {
      const target = this.state.entries.find((e) => e.id === entryId);
      if (!target) {
        return { ok: false, errors: ['Lançamento não encontrado.'] };
      }

      try {
        await storage.delete(STORES.ENTRIES, entryId);
        this.state.entries = this.state.entries.filter((e) => e.id !== entryId);

        if (this.state.undoBuffer?.timerId) {
          clearTimeout(this.state.undoBuffer.timerId);
        }

        const timerId = setTimeout(() => {
          this.state.undoBuffer = null;
          if (this.state.toast?.undoable) {
            this.state.toast = null;
          }
          this.notify();
        }, 6000);

        this.state.undoBuffer = {
          storeName: STORES.ENTRIES,
          item: structuredClone(target),
          label: target.descricao,
          timerId
        };

        this.showToast(`"${target.descricao}" excluído.`, 'warning', true, 6000);
        return { ok: true };
      } catch (err) {
        return { ok: false, errors: [err.message || 'Não foi possível excluir o lançamento.'] };
      }
    });
  }

  /**
   * Desfaz a última exclusão realizada nos últimos 6 segundos.
   */
  async undoLastDelete() {
    const buf = this.state.undoBuffer;
    if (!buf || !buf.item) return { ok: false };

    if (buf.timerId) clearTimeout(buf.timerId);
    this.state.undoBuffer = null;

    try {
      await storage.put(buf.storeName, buf.item);
      if (buf.storeName === STORES.ENTRIES) {
        this.state.entries = this._sortEntries([buf.item, ...this.state.entries]);
      } else if (buf.storeName === STORES.ENVELOPES) {
        this.state.envelopes = [...this.state.envelopes, buf.item];
      } else if (buf.storeName === STORES.RECURRENCES) {
        this.state.recurrences = [...this.state.recurrences, buf.item];
      } else if (buf.storeName === STORES.GOALS) {
        this.state.goals = [...this.state.goals, buf.item];
      }
      this.showToast('Exclusão desfeita. Registro restaurado.', 'success');
      return { ok: true };
    } catch (err) {
      this.showToast('Erro ao restaurar o registro.', 'error');
      return { ok: false };
    }
  }

  /**
   * Confirma uma conta fixa/recorrente prevista com 1 toque, gerando o lançamento real no mês.
   */
  async confirmRecurrenceInstance(instance) {
    return this.withLock(`confirm_rec_${instance.instanceKey}`, async () => {
      const rawEntry = {
        tipo: instance.tipo || 'saida',
        valor: instance.valor,
        data: instance.dataVencimento,
        contaId: instance.contaId,
        categoriaId: instance.categoriaId,
        descricao: instance.descricao,
        observacao: 'Confirmado a partir de conta fixa recorrente',
        etiquetas: ['recorrente'],
        recorrenciaId: instance.recorrenciaId,

      };
      return this.saveEntry(rawEntry, 1);
    });

  /**

  async saveAccount(accountData) {
    return this.withLock('saveAccount', async () => {
      const nome = String(accountData.nome || '').trim();
      if (!nome) return { ok: false, errors: ['Informe o nome da conta.'] };

      const existing = accountData.id ? this.state.accounts.find((a) => a.id === accountData.id) : null;
      const account = {
        id: existing ? existing.id : generateId(),
        nome,
        tipo: ['carteira', 'corrente', 'poupanca', 'cartao'].includes(accountData.tipo) ? accountData.tipo : 'corrente',
        cor: accountData.cor || '#4B6B53',
        icone: accountData.icone || 'bank',
        ordem: existing ? existing.ordem : this.state.accounts.length + 1,

      };

      await storage.put(STORES.ACCOUNTS, account);
      if (existing) {
        this.state.accounts = this.state.accounts.map((a) => (a.id === account.id ? account : a));
      } else {
