function mountTestSuiteUI(rootEl, summaryEl) {
  if (!rootEl) return;
  const results = runAllTests();
  const total = results.length;
  const passed = results.filter((t) => t.passed).length;
  const failed = total - passed;

  if (summaryEl) {
    summaryEl.className = `test-summary ${failed === 0 ? 'all-passed' : 'has-failed'}`;
    summaryEl.textContent =
      failed === 0
        ? `✓ TODOS OS ${total} TESTES APROVADOS (${passed}/${total})`
        : `✕ ${failed} TESTE(S) REPROVADO(S) DE ${total}`;
  }

  rootEl.innerHTML = results
    .map(
      (item) => `
        <div class="test-row ${item.passed ? 'is-pass' : 'is-fail'}">
          <div class="test-status-badge">${item.passed ? 'APROVADO' : 'REPROVADO'}</div>
          <div class="test-info">
            <div class="test-group">${item.group}</div>
            <div class="test-name">${item.name}</div>
            ${item.error ? `<pre class="test-error">${item.error}</pre>` : ''}
          </div>
        </div>
      `
    )
    .join('');
}

if (typeof document !== 'undefined') {
  const autoRoot = document.querySelector('[data-test-runner-root]');
  const autoSummary = document.querySelector('[data-test-runner-summary]');
  if (autoRoot) {
    mountTestSuiteUI(autoRoot, autoSummary);
  }
}

/**
 * RAZÃO — Controlador Principal da Interface e Eventos (app.js)
 * Correções Críticas e Redesign:
 * - B1: Fechamento da folha inferior apenas quando event.target === actionBtn no backdrop,
 *   ou ao clicar em close-entry-sheet-btn (✕), pressionar Escape ou arrastar para baixo.
 * - B2: Preserva valor digitado ao alternar entre Saída, Entrada e Transferência;
 *   seleciona automaticamente a primeira categoria correspondente; parcelamento apenas em saída.
 * - B5: Máscara monetária ao vivo (formatMoneyMask) em todos os inputs com data-money-mask="true".
 * - B8: Confirmação em 2 passos antes de "Limpar Tudo", remoção individual de chips de filtro,
 *   vibração sutil (navigator.vibrate) ao salvar e destaque interativo de fatias do gráfico de rosca.
 */
class RazaoAppController {
  constructor() {
    this.historyVisibleLimit = HISTORY_BATCH_SIZE;
    this.entrySheetDraft = { isOpen: false };
    this.isFilterSheetOpen = false;
    this.activePlanSection = 'envelopes';
    this.confirmClearOpen = false;
    this.importPreviewState = null;
    this.lastAnimatedDailyFree = 0;
    this._touchDragStartY = null;
  }

  async start() {
    this.bindGlobalDelegation();
    store.subscribe((state) => this.render(state));
    await store.init();
    this.registerServiceWorker();
  }

  registerServiceWorker() {
    if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }
  }

  triggerHaptic() {
    try {
      if (typeof navigator !== 'undefined' && typeof navigator.vibrate === 'function') {
        navigator.vibrate(15);
      }
    } catch (_) {}
  }

  openEntrySheet(existingEntry = null) {
    const state = store.state;
    const defaultCat = state.categories.find((c) => !c.arquivada && c.tipo === 'saida') || state.categories[0];
    const defaultAcc = state.accounts.find((a) => !a.arquivada) || state.accounts[0];
    const secondAcc = state.accounts.find((a) => !a.arquivada && a.id !== defaultAcc?.id) || defaultAcc;

    if (existingEntry) {
      this.entrySheetDraft = {
        isOpen: true,
        ...structuredClone(existingEntry),
        valorInput: formatDecimalBRL(existingEntry.valor),
        installments: 1
      };
    } else {
      this.entrySheetDraft = {
        isOpen: true,
        id: null,
        tipo: 'saida',
        valorInput: '',
        data: todayISO(),
        contaId: defaultAcc ? defaultAcc.id : '',
        contaDestinoId: secondAcc ? secondAcc.id : '',
        categoriaId: defaultCat ? defaultCat.id : '',
        descricao: '',
        observacao: '',
        etiquetas: [],
        installments: 1
      };
    }

    this.renderSheetOnly();
    setTimeout(() => {
      const amountInput = document.getElementById('entry-amount-input');
      if (amountInput) amountInput.focus();
    }, 40);
  }

  closeEntrySheet() {
    this.entrySheetDraft = { isOpen: false };
    this.renderSheetOnly();
  }

  renderSheetOnly() {
    const sheetRoot = document.getElementById('sheet-root');
    if (!sheetRoot) return;
    sheetRoot.innerHTML = renderEntrySheetModal(store.state, this.entrySheetDraft);
  }

  renderToastOnly(state) {
    const toastRoot = document.getElementById('toast-root');
    if (!toastRoot) return;
    const toast = state.toast;
    if (!toast) {
      toastRoot.innerHTML = '';
      return;
    }

    toastRoot.innerHTML = `
      <div class="ledger-toast is-${escapeHTML(toast.type)}" role="status" aria-live="polite">
        <span class="toast-check-icon">${getIconSVG(toast.type === 'error' || toast.type === 'warning' ? 'alert' : 'check')}</span>
        <span class="toast-msg">${escapeHTML(toast.message)}</span>
        <div class="toast-actions">
          ${
            toast.undoable
              ? `<button type="button" class="btn btn-sm btn-undo" data-action="undo-delete">Desfazer (6s)</button>`
              : ''
          }
          <button type="button" class="toast-close" data-action="dismiss-toast" aria-label="Fechar aviso">
            ${getIconSVG('close')}
          </button>
        </div>
      </div>
    `;
  }

  renderLockOverlay(state) {
    const lockRoot = document.getElementById('lock-root');
    if (!lockRoot) return;
    if (!state.locked) {
      lockRoot.innerHTML = '';
      return;
    }

    lockRoot.innerHTML = `
      <div class="pin-lock-screen" role="dialog" aria-modal="true" aria-labelledby="lock-title">
        <div class="pin-lock-card">
          ${getEmptyLedgerIllustrationSVG()}
          <h1 id="lock-title" class="page-serif-title">Livro-Razão Protegido</h1>
          <p class="setting-desc">Digite seu PIN pessoal de 4 a 6 dígitos para abrir o caderno contábil.</p>
          <form id="pin-unlock-form" novalidate>
            <input
              type="password"
              inputmode="numeric"
              pattern="[0-9]*"
              maxlength="6"
              id="pin-unlock-input"
              class="pin-giant-input"
              placeholder="••••"
              aria-label="PIN de desbloqueio"
              required
              autofocus
            />
            <div id="pin-unlock-error" class="form-error-banner" role="alert" hidden></div>
            <button type="submit" class="btn btn-primary btn-block btn-lg">Desbloquear Razão</button>
          </form>
        </div>
      </div>
    `;
  }

  render(state) {
    document.documentElement.setAttribute('data-theme', state.settings.theme || 'dark');

    // Atualiza ícones do cabeçalho (Ocultar valores, Tema e Ajustes)
    const hideBtn = document.getElementById('header-hide-btn');
    if (hideBtn) {
      hideBtn.innerHTML = getIconSVG(state.settings.hideValues ? 'eye-off' : 'eye');
      hideBtn.setAttribute(
        'aria-label',
        state.settings.hideValues ? 'Mostrar valores monetários' : 'Ocultar valores monetários'
      );
      hideBtn.setAttribute('aria-pressed', String(Boolean(state.settings.hideValues)));
    }

    const themeBtn = document.getElementById('header-theme-btn');
    if (themeBtn) {
      const isLight = state.settings.theme === 'light';
      themeBtn.innerHTML = getIconSVG(isLight ? 'moon' : 'sun');
      themeBtn.setAttribute(
        'aria-label',
        isLight ? 'Alternar para tema escuro Grafite' : 'Alternar para tema claro Papel Quente'
      );
    }

    const settingsHeaderBtn = document.getElementById('header-settings-btn');
    if (settingsHeaderBtn) {
      settingsHeaderBtn.classList.toggle('is-active', state.activeTab === 'ajustes');
      settingsHeaderBtn.setAttribute('aria-current', state.activeTab === 'ajustes' ? 'page' : 'false');
    }

    // Atualiza barra inferior e o indicador deslizante animado
    const tabIndexMap = { inicio: 0, historico: 1, planejar: 2, analises: 3 };
    const bottomNav = document.querySelector('.bottom-nav');
    if (bottomNav) {
      const activeIdx = tabIndexMap[state.activeTab];
      if (typeof activeIdx === 'number') {
        bottomNav.style.setProperty('--active-nav-idx', String(activeIdx));
        bottomNav.classList.remove('is-settings-active');
      } else {
        bottomNav.classList.add('is-settings-active');
      }
    }

    const navButtons = document.querySelectorAll('.bottom-nav-item[data-tab], .sidebar-nav-btn[data-tab]');
    navButtons.forEach((btn) => {
      const isCurrent = btn.getAttribute('data-tab') === state.activeTab;
      btn.classList.toggle('is-active', isCurrent);
      if (isCurrent) {
        btn.setAttribute('aria-current', 'page');
      } else {
        btn.removeAttribute('aria-current');
      }
    });

    // Preserva foco ativo se estiver digitando
    const activeEl = document.activeElement;
    const activeId = activeEl ? activeEl.id : null;
    const selStart = activeEl && typeof activeEl.selectionStart === 'number' ? activeEl.selectionStart : null;

    const mainRoot = document.getElementById('app-main');
    if (mainRoot) {
      if (state.activeTab === 'inicio') {
        mainRoot.innerHTML = renderHomeScreen(state);
        const heroEl = document.getElementById('animated-free-daily');
        if (heroEl) {
          const targetCents = Number(heroEl.getAttribute('data-cents') || 0);
          const spanVal = heroEl.querySelector('.money-value');
          if (spanVal && !state.settings.hideValues) {
            animateCurrencyCounter(spanVal, this.lastAnimatedDailyFree, targetCents, false);
          }
          this.lastAnimatedDailyFree = targetCents;
        }
      } else if (state.activeTab === 'historico') {
        mainRoot.innerHTML = renderHistoryScreen(state, this.historyVisibleLimit, this.isFilterSheetOpen);
      } else if (state.activeTab === 'planejar') {
        mainRoot.innerHTML = renderPlanScreen(state, this.activePlanSection);
      } else if (state.activeTab === 'analises') {
        mainRoot.innerHTML = renderAnalyticsScreen(state);
      } else if (state.activeTab === 'ajustes') {
        mainRoot.innerHTML = renderSettingsScreen(state, this.importPreviewState, this.confirmClearOpen);
      }
    }

    if (activeId) {
      const restored = document.getElementById(activeId);
      if (restored) {
        restored.focus();
        if (selStart !== null && typeof restored.setSelectionRange === 'function') {
          try {
            restored.setSelectionRange(selStart, selStart);
          } catch (_) {}
        }
      }
    }

    this.renderSheetOnly();
    this.renderToastOnly(state);
    this.renderLockOverlay(state);
  }

  /**
   * B2: Sincroniza todos os campos digitados na folha de lançamento antes de trocar tipo ou categoria,
   * garantindo que o valor já digitado NUNCA seja apagado.
   */
  syncDraftFromSheetDOM() {
    const form = document.getElementById('entry-sheet-form');
    if (!form || !this.entrySheetDraft.isOpen) return;
    const fd = new FormData(form);
    const rawVal = fd.get('valorInput');
    if (rawVal !== null) this.entrySheetDraft.valorInput = String(rawVal);
    const rawData = fd.get('data');
    if (rawData) this.entrySheetDraft.data = String(rawData);
    const rawConta = fd.get('contaId');
    if (rawConta) this.entrySheetDraft.contaId = String(rawConta);
    const rawDest = fd.get('contaDestinoId');
    if (rawDest) this.entrySheetDraft.contaDestinoId = String(rawDest);
    const rawDesc = fd.get('descricao');
    if (rawDesc !== null) this.entrySheetDraft.descricao = String(rawDesc);
    const rawObs = fd.get('observacao');
    if (rawObs !== null) this.entrySheetDraft.observacao = String(rawObs);
    const rawTags = fd.get('etiquetas');
    if (rawTags !== null) this.entrySheetDraft.etiquetas = String(rawTags);
    const rawInst = fd.get('installments');
    if (rawInst !== null) this.entrySheetDraft.installments = Number(rawInst || 1);
  }

  bindGlobalDelegation() {
    if (this._delegationBound) return;
    this._delegationBound = true;

    // 1. Cliques delegados (data-action)
    document.addEventListener('click', async (event) => {
      // Tooltip interativo e destaque de fatia em gráficos SVG
      const svgShape = event.target.closest('[data-tooltip-title]');
      if (svgShape) {
        const title = svgShape.getAttribute('data-tooltip-title');
        const val = svgShape.getAttribute('data-tooltip-value');
        const sub = svgShape.getAttribute('data-tooltip-sub');
        const sliceIdx = svgShape.getAttribute('data-slice-idx');

        if (sliceIdx !== null) {
          document.querySelectorAll('.donut-slice-arc').forEach((arc) => {
            arc.classList.toggle('is-highlighted', arc.getAttribute('data-slice-idx') === sliceIdx);
          });
          document.querySelectorAll('.donut-legend-item').forEach((li) => {
            li.classList.toggle('is-highlighted', li.getAttribute('data-slice-idx') === sliceIdx);
          });
        }

        const banner = document.getElementById('chart-touch-tooltip');
        if (banner) {
          banner.innerHTML = `
            <div class="tooltip-active-content">
              <strong>${escapeHTML(title)}</strong>
              <span class="tooltip-sep">·</span>
              <span class="tooltip-val">${escapeHTML(val)}</span>
              <span class="tooltip-sub">(${escapeHTML(sub)})</span>
            </div>
          `;
        }
      }

      const actionBtn = event.target.closest('[data-action]');
      if (!actionBtn) return;

      const action = actionBtn.getAttribute('data-action');

      switch (action) {
        case 'go-tab': {
          const tab = actionBtn.getAttribute('data-tab');
          if (tab) {
            this.historyVisibleLimit = HISTORY_BATCH_SIZE;
            this.isFilterSheetOpen = false;
            this.confirmClearOpen = false;
            store.setTab(tab);
            window.scrollTo({ top: 0, behavior: 'smooth' });
          }
          break;
        }

        case 'select-7d-bar': {
          const dStr = actionBtn.getAttribute('data-7d-date') || '';
          const wStr = actionBtn.getAttribute('data-7d-weekday') || '';
          const vStr = actionBtn.getAttribute('data-7d-val') || '';
          const readout = document.getElementById('mini-7d-value-readout');
          if (readout) {
            readout.textContent = `${wStr} (${dStr}): ${vStr}`;
          }
          document.querySelectorAll('.mini-bar-col').forEach((col) => {
            col.classList.toggle('is-selected', col === actionBtn);
          });
          break;
        }

        case 'dismiss-backup-7d': {
          const untilDate = addDaysISO(todayISO(), 7);
          await store.updateSettings({ backupDismissedUntil: untilDate });
          store.showToast('Aviso dispensado por 7 dias.', 'info');
          break;
        }

        case 'go-plan-envelopes': {
          this.activePlanSection = 'envelopes';
          store.setTab('planejar');
          window.scrollTo({ top: 0, behavior: 'smooth' });
          break;
        }

        case 'prev-month': {
          store.setSelectedMonth(shiftMonthKey(store.state.selectedMonth, -1));
          break;
        }

        case 'next-month': {
          store.setSelectedMonth(shiftMonthKey(store.state.selectedMonth, 1));
          break;
        }

        case 'toggle-theme': {
          await store.toggleTheme();
          break;
        }

        case 'toggle-hide-values': {
          await store.toggleHideValues();
          break;
        }

        case 'open-entry-sheet': {
          this.openEntrySheet(null);
          break;
        }

        // B1: Fecha a folha de lançamento SOMENTE se clicou diretamente no fundo (.sheet-backdrop)
        case 'close-entry-sheet': {
          if (event.target === actionBtn) {
            this.closeEntrySheet();
          }
          break;
        }

        // B1: Botão explícito ✕ da folha de lançamento
        case 'close-entry-sheet-btn': {
          this.closeEntrySheet();
          break;
        }

        // B1 & B2: Alternar entre Saída, Entrada e Transferência preservando valor e ajustando categorias
        case 'set-entry-type': {
          this.syncDraftFromSheetDOM();
          const newType = actionBtn.getAttribute('data-entry-type');
          if (['saida', 'entrada', 'transferencia'].includes(newType)) {
            this.entrySheetDraft.tipo = newType;
            if (newType !== 'saida') {
              this.entrySheetDraft.installments = 1;
            }
            if (newType !== 'transferencia') {
              const matchingCat = store.state.categories.find(
                (c) => !c.arquivada && c.tipo === (newType === 'entrada' ? 'entrada' : 'saida')
              );
              if (matchingCat) {
                this.entrySheetDraft.categoriaId = matchingCat.id;
              }
            } else {
              const activeAccs = store.state.accounts.filter((a) => !a.arquivada);
              const originId = this.entrySheetDraft.contaId || activeAccs[0]?.id || '';
              if (!this.entrySheetDraft.contaDestinoId || this.entrySheetDraft.contaDestinoId === originId) {
                const diffAcc = activeAccs.find((a) => a.id !== originId);
                this.entrySheetDraft.contaDestinoId = diffAcc ? diffAcc.id : '';
              }
            }
            this.renderSheetOnly();
          }
          break;
        }

        case 'select-entry-cat': {
          this.syncDraftFromSheetDOM();
          const catId = actionBtn.getAttribute('data-cat-id');
          this.entrySheetDraft.categoriaId = catId;
          this.renderSheetOnly();
          break;
        }

        case 'edit-entry': {
          const entryId = actionBtn.getAttribute('data-entry-id');
          const found = store.state.entries.find((e) => e.id === entryId);
          if (found) this.openEntrySheet(found);
          break;
        }

        case 'delete-entry': {
          const entryId = actionBtn.getAttribute('data-entry-id');
          if (entryId) await store.deleteEntry(entryId);
          break;
        }

        case 'delete-from-sheet': {
          const entryId = actionBtn.getAttribute('data-entry-id');
          if (entryId) {
            this.closeEntrySheet();
            await store.deleteEntry(entryId);
          }
          break;
        }

        case 'undo-delete': {
          await store.undoLastDelete();
          break;
        }

        case 'dismiss-toast': {
          store.dismissToast();
          break;
        }

        case 'confirm-recurrence': {
          const instanceKey = actionBtn.getAttribute('data-instance-key');
          const list = getRecurrencesForMonth(
            store.state.recurrences,
            store.state.entries,
            store.state.selectedMonth
          );
          const target = list.find((i) => i.instanceKey === instanceKey);
          if (target) {
            await store.confirmRecurrenceInstance(target);
            this.triggerHaptic();
          }
          break;
        }

        case 'filter-by-account': {
          const accountId = actionBtn.getAttribute('data-account-id');
          if (accountId) {
            store.setFilters({ accountId });
            store.setTab('historico');
          }
          break;
        }

        case 'open-filter-sheet': {
          this.isFilterSheetOpen = true;
          this.render(store.state);
          break;
        }

        case 'close-filter-sheet': {
          if (event.target === actionBtn) {
            this.isFilterSheetOpen = false;
            this.render(store.state);
          }
          break;
        }

        case 'close-filter-sheet-btn': {
          this.isFilterSheetOpen = false;
          this.render(store.state);
          break;
        }

        case 'remove-single-filter': {
          const key = actionBtn.getAttribute('data-filter-key');
          if (key === 'period') store.setFilters({ period: 'all', startDate: '', endDate: '' });
          else if (key === 'type') store.setFilters({ type: 'all' });
          else if (key === 'accountId') store.setFilters({ accountId: 'all' });
          else if (key === 'categoryId') store.setFilters({ categoryId: 'all' });
          else if (key === 'minCents') store.setFilters({ minCents: null });
          else if (key === 'maxCents') store.setFilters({ maxCents: null });
          break;
        }

        case 'reset-filters': {
          this.historyVisibleLimit = HISTORY_BATCH_SIZE;
          store.resetFilters();
          break;
        }

        case 'load-more-history': {
          this.historyVisibleLimit += HISTORY_BATCH_SIZE;
          this.render(store.state);
          break;
        }

        case 'set-plan-section': {
          const sec = actionBtn.getAttribute('data-plan-section');
          if (sec) {
            this.activePlanSection = sec;
            this.render(store.state);
          }
          break;
        }

        case 'delete-envelope': {
          const id = actionBtn.getAttribute('data-envelope-id');
          if (id) await store.deleteEnvelope(id);
          break;
        }

        case 'delete-recurrence': {
          const id = actionBtn.getAttribute('data-recurrence-id');
          if (id) await store.deleteRecurrence(id);
          break;
        }

        case 'delete-goal': {
          const id = actionBtn.getAttribute('data-goal-id');
          if (id) await store.deleteGoal(id);
          break;
        }

        case 'toggle-archive-account': {
          const id = actionBtn.getAttribute('data-account-id');
          const acc = store.state.accounts.find((a) => a.id === id);
          if (acc) {
            await store.saveAccount({ ...acc, arquivada: !acc.arquivada });
          }
          break;
        }

        case 'move-cat-up': {
          const id = actionBtn.getAttribute('data-cat-id');
          if (id) await store.moveCategoryOrder(id, 'up');
          break;
        }

        case 'move-cat-down': {
          const id = actionBtn.getAttribute('data-cat-id');
          if (id) await store.moveCategoryOrder(id, 'down');
          break;
        }

        case 'delete-or-archive-cat': {
          const id = actionBtn.getAttribute('data-cat-id');
          if (id) await store.deleteOrArchiveCategory(id);
          break;
        }

        case 'export-backup-json':
        case 'quick-export-json': {
          const { jsonString } = buildBackupJSON(store.state);
          const filename = `razao-backup-${todayISO()}.json`;
          triggerFileDownload(filename, jsonString, 'application/json;charset=utf-8');
          await store.updateSettings({ lastBackupAt: new Date().toISOString() });
          store.showToast('Backup JSON exportado com sucesso.', 'success');
          break;
        }

        case 'export-history-csv': {
          const csv = buildEntriesCSV(
            store.state.entries,
            store.state.accounts,
            store.state.categories
          );
          const filename = `razao-historico-${todayISO()}.csv`;
          triggerFileDownload(filename, csv, 'text/csv;charset=utf-8');
          store.showToast('Histórico exportado em formato CSV.', 'success');
          break;
        }

        case 'confirm-import': {
          const mode = actionBtn.getAttribute('data-import-mode') || 'replace';
          if (this.importPreviewState?.snapshot) {
            await store.importBackupSnapshot(this.importPreviewState.snapshot, mode);
            this.importPreviewState = null;
            this.render(store.state);
          }
          break;
        }

        case 'cancel-import': {
          this.importPreviewState = null;
          this.render(store.state);
          break;
        }

        case 'remove-pin': {
          await store.configurePin('');
          break;
        }

        case 'lock-now': {
          if (store.state.settings.pinHash) {
            store.state.locked = true;
            store.notify();
          }
          break;
        }

        case 'run-stress-generator': {
          const count = Number(actionBtn.getAttribute('data-count') || 2040);
          await store.runStressDatasetGenerator(count);
          break;
        }

        
        case 'run-inline-tests': {
          const results = runAllTests();
          const passed = results.filter((t) => t.passed).length;
          store.showToast(`Suite Técnica: ${passed}/${results.length} testes aprovados!`, passed === results.length ? 'success' : 'error', false, 6000);
          const reportBox = document.getElementById('inline-test-report-box');
          if (reportBox) {
            const detailsParent = reportBox.closest('details');
            if (detailsParent) detailsParent.open = true;
            reportBox.innerHTML = `<div class="import-preview-card" style="margin-top:8px"><strong>Resultado: ${passed}/${results.length} testes aprovados!</strong><ul class="preview-stats-list">` +
              results.map((r) => `<li>${r.passed ? '✓' : '✕'} <strong>${escapeHTML(r.group)}</strong>: ${escapeHTML(r.name)}</li>`).join('') +
              `</ul></div>`;
          }
          break;
        }

        case 'ask-clear-all-data': {
          this.confirmClearOpen = true;
          this.render(store.state);
          break;
        }

        case 'cancel-clear-all-data': {
          this.confirmClearOpen = false;
          this.render(store.state);
          break;
        }

        case 'clear-all-data': {
          this.confirmClearOpen = false;
          await store.clearAllData();
          break;
        }
      }
    });

    // 2. Submissão de formulários
    document.addEventListener('submit', async (event) => {
      const form = event.target;

      // 2.1. Formulário da Folha de Lançamento Rápido
      if (form.id === 'entry-sheet-form') {
        event.preventDefault();
        const fd = new FormData(form);
        const tipo = this.entrySheetDraft.tipo || 'saida';
        const categoriaId = fd.get('categoriaId') || this.entrySheetDraft.categoriaId;
        const catObj = store.state.categories.find((c) => c.id === categoriaId);

        let descricao = String(fd.get('descricao') || '').trim();
        if (!descricao) {
          descricao = tipo === 'transferencia' ? 'Transferência entre contas' : (catObj ? catObj.nome : 'Lançamento');
        }

        const rawPayload = {
          id: this.entrySheetDraft.id || null,
          tipo,
          valorInput: fd.get('valorInput'),
          data: fd.get('data') || todayISO(),
          contaId: fd.get('contaId'),
          contaDestinoId: fd.get('contaDestinoId'),
          categoriaId: tipo === 'transferencia' ? null : categoriaId,
          descricao,
          observacao: fd.get('observacao') || '',
          etiquetas: fd.get('etiquetas') || ''
        };

        const installments = tipo === 'saida' ? Number(fd.get('installments') || 1) : 1;
        const res = await store.saveEntry(rawPayload, installments);

        if (!res.ok) {
          const errEl = document.getElementById('entry-form-error');
          if (errEl) {
            errEl.textContent = res.errors.join(' ');
            errEl.hidden = false;
          }
        } else {
          this.triggerHaptic();
          this.closeEntrySheet();
        }
        return;
      }

      // 2.2. Formulário de Envelope
      if (form.id === 'envelope-form') {
        event.preventDefault();
        const fd = new FormData(form);
        const parsed = parseMoneyInput(fd.get('limiteInput'));
        if (!parsed.ok) {
          store.showToast(parsed.error, 'error');
          return;
        }
        await store.saveEnvelope({
          categoriaId: fd.get('categoriaId'),
          limiteMensal: parsed.cents
        });
        this.triggerHaptic();
        form.reset();
        return;
      }

      // 2.3. Formulário de Conta Fixa / Recorrência
      if (form.id === 'recurrence-form') {
        event.preventDefault();
        const fd = new FormData(form);
        const parsed = parseMoneyInput(fd.get('valorInput'));
        if (!parsed.ok) {
          store.showToast(parsed.error, 'error');
          return;
        }
        const res = await store.saveRecurrence({
          descricao: fd.get('descricao'),
          valor: parsed.cents,
          tipo: fd.get('tipo'),
          frequencia: fd.get('frequencia'),
          diaVencimento: Number(fd.get('diaVencimento') || 10),
          contaId: fd.get('contaId'),
          categoriaId: fd.get('categoriaId')
        });
        if (!res.ok) store.showToast(res.errors.join(' '), 'error');
        else {
          this.triggerHaptic();
          form.reset();
        }
        return;
      }

      // 2.4. Formulário de Meta de Economia
      if (form.id === 'goal-form') {
        event.preventDefault();
        const fd = new FormData(form);
        const alvoParsed = parseMoneyInput(fd.get('valorAlvoInput'));
        const atualParsed = parseMoneyInput(fd.get('valorAtualInput') || '0', { allowZero: true });
        const aporteParsed = parseMoneyInput(fd.get('aporteMensalInput'));

        if (!alvoParsed.ok) {
          store.showToast(`Valor Alvo: ${alvoParsed.error}`, 'error');
          return;
        }
        if (!atualParsed.ok) {
          store.showToast(`Valor Guardado: ${atualParsed.error}`, 'error');
          return;
        }
        if (!aporteParsed.ok) {
          store.showToast(`Aporte Mensal: ${aporteParsed.error}`, 'error');
          return;
        }

        const res = await store.saveGoal({
          nome: fd.get('nome'),
          valorAlvo: alvoParsed.cents,
          valorAtual: atualParsed.cents,
          aporteMensal: aporteParsed.cents
        });
        if (!res.ok) store.showToast(res.errors.join(' '), 'error');
        else {
          this.triggerHaptic();
          form.reset();
        }
        return;
      }

      // 2.5. Formulário de Nova Conta
      if (form.id === 'account-create-form') {
        event.preventDefault();
        const fd = new FormData(form);
        const res = await store.saveAccount({
          nome: fd.get('nome'),
          tipo: fd.get('tipo'),
          cor: fd.get('cor')
        });
        if (!res.ok) store.showToast(res.errors.join(' '), 'error');
        else {
          this.triggerHaptic();
          form.reset();
        }
        return;
      }

      // 2.6. Formulário de Nova Categoria
      if (form.id === 'category-create-form') {
        event.preventDefault();
        const fd = new FormData(form);
        const res = await store.saveCategory({
          nome: fd.get('nome'),
          tipo: fd.get('tipo'),
          icone: fd.get('icone'),
          cor: fd.get('cor')
        });
        if (!res.ok) store.showToast(res.errors.join(' '), 'error');
        else {
          this.triggerHaptic();
          form.reset();
        }
        return;
      }

      // 2.7. Configuração de PIN
      if (form.id === 'pin-config-form') {
        event.preventDefault();
        const fd = new FormData(form);
        const res = await store.configurePin(fd.get('pin'));
        if (!res.ok) store.showToast(res.errors.join(' '), 'error');
        else {
          this.triggerHaptic();
          form.reset();
        }
        return;
      }

      // 2.8. Desbloqueio de PIN
      if (form.id === 'pin-unlock-form') {
        event.preventDefault();
        const input = document.getElementById('pin-unlock-input');
        const res = await store.unlockWithPin(input ? input.value : '');
        if (!res.ok) {
          const err = document.getElementById('pin-unlock-error');
          if (err) {
            err.textContent = res.error;
            err.hidden = false;
          }
        }
      }
    });

    // 3. B5: Máscara monetária ao digitar + busca em tempo real no Histórico
    document.addEventListener('input', (event) => {
      const target = event.target;

      if (target && target.getAttribute('data-money-mask') === 'true') {
        const masked = formatMoneyMask(target.value);
        if (target.value !== masked) {
          target.value = masked;
        }
        if (target.id === 'entry-amount-input') {
          if (this.entrySheetDraft.isOpen) {
            this.entrySheetDraft.valorInput = masked;
          }
          const hintEl = document.getElementById('entry-amount-hint');
          if (hintEl) {
            hintEl.textContent = getAmountInputHint(masked);
          }
        }
        return;
      }

      if (target.id === 'history-search-input') {
        this.historyVisibleLimit = HISTORY_BATCH_SIZE;
        store.setFilters({ query: target.value });
      }
    });

    // 4. Mudanças em filtros e upload de JSON
    document.addEventListener('change', async (event) => {
      const target = event.target;

      if (target.id === 'filter-period') {
        this.historyVisibleLimit = HISTORY_BATCH_SIZE;
        store.setFilters({ period: target.value });
      } else if (target.id === 'filter-account') {
        this.historyVisibleLimit = HISTORY_BATCH_SIZE;
        store.setFilters({ accountId: target.value });
      } else if (target.id === 'filter-category') {
        this.historyVisibleLimit = HISTORY_BATCH_SIZE;
        store.setFilters({ categoryId: target.value });
      } else if (target.id === 'filter-type') {
        this.historyVisibleLimit = HISTORY_BATCH_SIZE;
        store.setFilters({ type: target.value });
      } else if (target.id === 'filter-start-date') {
        store.setFilters({ startDate: target.value });
      } else if (target.id === 'filter-end-date') {
        store.setFilters({ endDate: target.value });
      } else if (target.id === 'filter-min-val') {
        const parsed = parseMoneyInput(target.value);
        store.setFilters({ minCents: parsed.ok ? parsed.cents : null });
      } else if (target.id === 'filter-max-val') {
        const parsed = parseMoneyInput(target.value);
        store.setFilters({ maxCents: parsed.ok ? parsed.cents : null });
      } else if (target.id === 'backup-file-input' && target.files?.[0]) {
        const file = target.files[0];
        try {
          const text = await file.text();
          const validation = validateAndPreviewBackupJSON(text);
          if (!validation.ok) {
            store.showToast(validation.errors.join(' '), 'error');
          } else {
            this.importPreviewState = validation;
            this.render(store.state);
          }
        } catch (_) {
          store.showToast('Não foi possível ler o arquivo selecionado.', 'error');
        }
      }
    });

    // 4.5. Item 6: Ao focar o campo de valor vazio, garante exibição da dica
    document.addEventListener('focusin', (event) => {
      const target = event.target;
      if (target && target.id === 'entry-amount-input') {
        const hintEl = document.getElementById('entry-amount-hint');
        if (hintEl) {
          hintEl.textContent = getAmountInputHint(target.value);
        }
      }
    });

    // 5. B1: Fechar folha inferior com tecla Escape
    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') {
        if (this.entrySheetDraft.isOpen) {
          this.closeEntrySheet();
        } else if (this.isFilterSheetOpen) {
          this.isFilterSheetOpen = false;
          this.render(store.state);
        }
      }
    });

    // 6. B1: Fechar folha inferior ao arrastar para baixo (swipe-down na alça)
    document.addEventListener(
      'touchstart',
      (event) => {
        const dragZone = event.target.closest('[data-sheet-drag]');
        if (dragZone && event.touches?.[0]) {
          this._touchDragStartY = event.touches[0].clientY;
        } else {
          this._touchDragStartY = null;
        }
      },
      { passive: true }
    );

    document.addEventListener(
      'touchend',
      (event) => {
        if (this._touchDragStartY !== null && event.changedTouches?.[0]) {
          const deltaY = event.changedTouches[0].clientY - this._touchDragStartY;
          if (deltaY > 55) {
            if (this.entrySheetDraft.isOpen) {
              this.closeEntrySheet();
            } else if (this.isFilterSheetOpen) {
              this.isFilterSheetOpen = false;
              this.render(store.state);
            }
          }
        }
        this._touchDragStartY = null;
      },
      { passive: true }
    );
  }
}
const app = new RazaoAppController();
app.start();



})();
</script>
